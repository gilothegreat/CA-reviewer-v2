<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CA Reviewer">
<meta name="theme-color" content="#f6f3ee">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Course Audit Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --panel:#ffffff; --ink:#1d1b18; --muted:#6b665e; --line:#e4ded4;
  --accent:#c2410c; --good:#16803c; --bad:#c62828; --soft:#efe9df; --hl:#fff1c2;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);
  --L1:#d9534f; --L2:#2f7dd1; --L3:#1f9d6b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141311;--panel:#1e1c19;--ink:#f1ece4;--muted:#a39d93;--line:#34302b;--soft:#28251f;--hl:#4a3d12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);--accent:#f97316;--good:#4ade80;--bad:#f87171}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.brand{font-family:Fraunces,serif;font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;cursor:pointer}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-style:normal;font-size:.85rem}
nav.tabs{margin-left:auto;display:flex;gap:4px}
.who{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px 3px 3px;display:flex;align-items:center;gap:7px;font-weight:600;font-size:.88rem;max-width:150px}
.who .wn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.who{margin-left:auto}.brand{font-size:1rem}}
@media (max-width:380px){.who .wn{display:none}.who{padding:3px}}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500}
nav.tabs button.on{background:var(--ink);color:var(--bg)}
nav.bottom{display:none}
@media (max-width:640px){
  nav.tabs{display:none}
  nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);padding:6px 0;border-radius:12px}
  nav.bottom button svg{width:22px;height:22px}
  nav.bottom button.on{color:var(--accent);background:var(--soft)}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}
@media(min-width:700px){.g3{grid-template-columns:repeat(3,1fr)}}
.hero h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:8px 0 4px}
.linkbtn{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:6px;color:var(--ink);font:inherit}
.hero p{color:var(--muted);margin:0 0 18px}
.lec{position:relative;overflow:hidden}
.lec .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
.lec h3{margin:0 0 2px;font-size:1.1rem}
.lec small{color:var(--muted)}
.meter{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.meter b{display:block;height:100%;border-radius:9px;transition:width .4s}
.stat{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:11px;font-weight:500;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default}
.chip{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:999px;font-size:.88rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity}.chips::-webkit-scrollbar{display:none}.chips .chip{flex:none;scroll-snap-align:start}.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sect-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:22px 0 8px}
input[type=search]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
/* reviewer */
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:10px 0;box-shadow:var(--shadow);overflow:hidden}
details.sec summary{list-style:none;padding:14px 16px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.8rem;color:#fff;flex:none}
details.sec summary .ch{margin-left:auto;transition:transform .2s;color:var(--muted)}
details.sec[open] summary .ch{transform:rotate(90deg)}
.sec .body{padding:0 16px 16px;font-size:.95rem}
.sec h4{margin:16px 0 6px;font-size:.95rem}
.sec ul,.sec ol{padding-left:22px;margin:6px 0}
.sec li{margin:3px 0}
.sec table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.88rem;display:block;overflow-x:auto}
.sec th,.sec td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.sec th{background:var(--soft)}
.mn{background:var(--soft);border-left:4px solid var(--accent);padding:10px 12px;border-radius:8px;margin:10px 0}
.note{background:color-mix(in srgb,var(--accent) 10%,var(--panel));border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);padding:10px 12px;border-radius:10px;margin:10px 0;font-size:.9rem}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.flow span{background:var(--soft);border:1px solid var(--line);padding:6px 10px;border-radius:10px;font-size:.86rem;position:relative}
.flow span:not(:last-child)::after{content:"→";margin-left:8px;color:var(--muted)}
.fb{display:inline-block;background:#f5b301;color:#3a2a00;font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:5px;vertical-align:middle;letter-spacing:.04em}
mark{background:var(--hl);color:inherit;border-radius:3px}
/* progress */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none;font-family:"DM Sans",sans-serif}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:9px 8px;border-radius:12px}
.prow.on{background:var(--soft);border-color:var(--line)}
.prow .pn,.lbr .pn{flex:1;min-width:0;display:flex;flex-direction:column}
.prow small,.lbr small{color:var(--muted);font-size:.78rem}
.pr{font-family:Fraunces,serif;font-weight:700;font-size:1.05rem}
.rk{width:20px;text-align:center;color:var(--muted);font-weight:700;font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tiles div{background:var(--soft);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.tiles b{font-size:1.25rem;font-family:Fraunces,serif}.tiles small{color:var(--muted);font-size:.75rem}
.lrow{padding:12px 0;border-bottom:1px solid var(--line)}.lrow:last-child{border-bottom:0}
.lrow .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}.lrow small{color:var(--muted);font-size:.78rem}.lrow .meter{margin:3px 0 0}
.tag{font-size:.75rem;font-weight:700;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}.cal i{aspect-ratio:1;border-radius:4px;background:var(--soft)}.cal i.on{background:var(--good)}
.lb{display:flex;flex-direction:column;gap:2px}.lbr{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}.lbr.me{background:var(--soft)}
.lbr .x{border:0;background:none;color:var(--muted);font-size:1.2rem;padding:0 4px}
.modal input:not([type]),.modal input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.modal .card{max-width:420px;max-height:85vh;overflow:auto}
.ctab{overflow-x:auto;margin:0 -4px}.ctab table{border-collapse:collapse;font-size:.82rem;min-width:100%}
.ctab th,.ctab td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}.ctab th{font-size:.72rem;color:var(--muted)}
.ctab td:nth-child(2),.ctab th:nth-child(2){text-align:left;position:sticky;left:0;background:var(--panel)}.ctab tr.me td:nth-child(2){font-weight:700}
.modal textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:12px/1.4 ui-monospace,monospace;word-break:break-all;resize:vertical}
.ai{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.ai.off{box-shadow:none;background:transparent;border-style:dashed}
.aichips{display:flex;gap:6px;overflow-x:auto;margin:10px -14px 0;padding:0 14px 4px;scrollbar-width:none}.aichips::-webkit-scrollbar{display:none}.aichips .chip{flex:none;font-size:.82rem;padding:6px 11px}.aichips .chip:disabled{opacity:.45}
.ailog{display:flex;flex-direction:column;gap:8px;margin-top:10px}.ailog:empty{display:none}
.aiq{align-self:flex-end;background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:14px 14px 4px 14px;font-size:.88rem;max-width:85%}
.aia{background:var(--soft);padding:10px 13px;border-radius:14px 14px 14px 4px;font-size:.93rem;line-height:1.5}
.aia p{margin:0 0 6px}.aia p:last-child{margin:0}.aia ul{margin:4px 0;padding-left:20px}.aia li{margin:2px 0}
.ainote{font-size:.82rem;color:var(--bad);margin:8px 0 0}
.aiform{display:flex;gap:8px;margin-top:10px}.aiform input{flex:1;min-width:0;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.tutor{display:flex;gap:12px;align-items:flex-start;margin-top:12px;background:color-mix(in srgb,var(--bad) 6%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 25%,var(--line));border-radius:16px;padding:12px}
.tav{width:84px;height:84px;flex:none;transform-origin:50% 90%}
.tbub{flex:1;min-width:0}.tname{font-weight:700;font-size:.9rem}.tintro{margin:4px 0 6px;font-weight:600}.ttext{font-size:.95rem;line-height:1.5}.tctl{margin-top:10px;gap:6px}
.tav .m-sad,.tav .m-happy,.tav .m-think,.tav .m-open{display:none}
.tav.sad .m-sad,.tav.happy .m-happy,.tav.think .m-think,.tav.wink .m-happy{display:block}
.tav .wink{display:none}.tav.wink .wink{display:block}.tav.wink .eyes ellipse:last-child{display:none}
.tav.talking .brows{animation:brow .9s ease-in-out infinite alternate}
@keyframes brow{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
.tavw{position:relative;flex:none}.treact{position:absolute;right:-6px;top:-8px;font-size:1.6rem;animation:pop 2.4s ease-out forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(0) rotate(-20deg);opacity:0}15%{transform:scale(1.25) rotate(8deg);opacity:1}30%{transform:scale(1) rotate(0)}80%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.tav.sad .bl{transform:rotate(-14deg);transform-origin:46px 45px}.tav.sad .br{transform:rotate(14deg);transform-origin:74px 45px}
.tav.talking .m-sad,.tav.talking .m-happy,.tav.talking .m-think{display:none}
.tav.talking .m-open{display:block;transform-origin:60px 73px;animation:talk .22s ease-in-out infinite alternate}
.tav .eyes{transform-origin:60px 56px;animation:blink 4.2s infinite}
.tav.shake{animation:shake .7s ease-in-out}
.tav.talking{animation:bob 1.4s ease-in-out infinite}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.1)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.tav,.tav *{animation:none!important}}
@media (max-width:420px){.tutor{flex-direction:column;align-items:center;text-align:left}.tbub{width:100%}}
.phtip{font-size:.8rem;color:var(--muted);margin-top:8px}.phtip summary{cursor:pointer;font-weight:600}
.warnbox{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));border-radius:12px;padding:10px 12px;font-size:.88rem;margin:10px 0}
.okbox{background:color-mix(in srgb,var(--good) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--good) 35%,var(--line));border-radius:12px;padding:10px 12px;font-size:.88rem;margin:10px 0}
.livedot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);animation:pulse 2s infinite}.livedot.bad{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.steps{padding-left:20px;font-size:.86rem;margin:6px 0 10px}.steps li{margin:4px 0}
.flab{display:block;font-size:.82rem;font-weight:600;margin-top:10px}.flab input{margin-top:4px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:400}
.ctab .x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:0 4px}
/* write it */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.mode span{font-size:1.8rem}.mode small{color:var(--muted);font-size:.76rem}.mode.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.wscore{font-weight:700;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--soft)}
.combo{font-weight:700;padding:4px 9px;border-radius:8px;background:color-mix(in srgb,#f97316 22%,var(--panel));animation:combo .5s ease}
@keyframes combo{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.timer.hurry{background:color-mix(in srgb,var(--bad) 25%,var(--panel));color:var(--bad)}
.wcard{position:relative;overflow:visible}
.win{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1.05rem;resize:vertical;min-height:84px}
.win:focus{outline:none;border-color:var(--accent)}
.padwrap{position:relative;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
#wPad{display:block;touch-action:none;cursor:crosshair}
.padtools{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}.padtools .on{border-color:var(--ink)}
.pcol{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}.pcol.on{box-shadow:0 0 0 2px var(--ink)}
.wres{margin-top:12px;border-radius:12px;padding:12px;background:var(--soft);animation:rise .35s ease}
.wres.good{background:color-mix(in srgb,var(--good) 13%,var(--panel))}.wres.mid{background:color-mix(in srgb,#d4880f 15%,var(--panel))}.wres.bad{background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pts{color:var(--good);font-size:1.1rem;animation:combo .5s ease}
.wans{margin-top:8px}.wans div{font-size:1rem;line-height:1.55}
.hit{background:color-mix(in srgb,var(--good) 28%,transparent);border-radius:4px;padding:0 2px}
.miss{text-decoration:underline wavy color-mix(in srgb,var(--bad) 70%,transparent);text-underline-offset:3px}
.wana{display:flex;gap:10px;align-items:center;margin-top:10px}.wana .tav{width:54px;height:54px}.wana .tavw{flex:none}
.wbub{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:.92rem;text-align:left}
.wover{margin-top:8px;font-size:.82rem;color:var(--muted);text-decoration:underline}
.wshake{animation:wshake .45s ease}
@keyframes wshake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.conf{position:absolute;top:40%;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:5;animation:conf 1.2s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 260px)) rotate(var(--r));opacity:0}}
.stars{font-size:2.6rem;letter-spacing:6px}.stars span{color:var(--line);display:inline-block}.stars span.on{color:#f5b301;animation:star .5s ease both}
@keyframes star{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.wthumb{display:block;max-width:220px;width:100%;border:1px solid var(--line);border-radius:8px;margin:6px 0}
@media (prefers-reduced-motion:reduce){.conf,.wshake,.stars span,.combo,.pts,.wres{animation:none!important}}
@media (max-width:640px){nav.bottom button{font-size:.66rem}}
/* reviewer notes */
.chip .nb{font-size:.72rem;opacity:.8}.chip .nb:empty{display:none}
.hasnote{margin-left:6px;font-size:.85rem}
.mynote{margin:0 0 4px}
details.sec .mynote{margin:12px 0 2px}
details.sec + .mynote{margin:-4px 6px 12px}
.addnote{border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:9px 12px;width:100%;text-align:left;color:var(--muted);font-weight:600}
.addnote:hover{border-color:var(--accent);color:var(--accent)}
.stick{border-radius:4px 4px 14px 4px;padding:10px 12px 12px;color:#2b2414;box-shadow:0 1px 1px rgba(0,0,0,.06),0 6px 14px rgba(0,0,0,.08);cursor:pointer;transform:rotate(-.4deg);transition:transform .15s}
.stick:hover{transform:rotate(0)}
.stick.editing{cursor:default;transform:none}
.stick-h{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;margin-bottom:4px}.stick-h small{opacity:.6}
.stick-t{white-space:pre-wrap;font-size:.95rem;line-height:1.5;font-family:"DM Sans",sans-serif}
.ntext{width:100%;border:0;background:transparent;color:#2b2414;font:inherit;font-size:.95rem;line-height:1.5;resize:none;outline:none;min-height:90px;background-image:linear-gradient(transparent 23px,rgba(0,0,0,.08) 24px);background-size:100% 24px}
.ncol{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,.15)}.ncol.on{box-shadow:0 0 0 2px #2b2414}
.stick .btn{background:rgba(255,255,255,.7);color:#2b2414;border-color:rgba(0,0,0,.12)}.stick .btn.pri{background:#2b2414;color:#fff}

<script>
const STANDALONE = true;
const DATA = [];
// ===== LECTURE 1: COMMUNICABLE DISEASES =====
const FB = '<span class="fb">FBEQ</span>';
DATA.push({
id: "L1", short: "Communicable Diseases", title: "Lecture 1 — Communicable Diseases", color: "#d9534f",
sub: "Malaria • Filariasis • Leprosy • Dengue",
sections: [
{ t: "Epidemiologic Definitions", h: `
<table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>Incubation period</b></td><td>Time from entry of the microorganism into the body up to the appearance of the first signs and symptoms.</td></tr>
<tr><td><b>Sporadic</b></td><td>Occasional, irregular, infrequent, "on & off" — few and isolated cases (often seasonal / rainy season).</td></tr>
<tr><td><b>Endemic</b></td><td>Continuously / constantly present in a specific area. ${FB} <b>Palawan</b> is a classic malaria-endemic area.</td></tr>
<tr><td><b>Epidemic</b></td><td>Unusually large number of cases / sudden increase in a certain geographic area.</td></tr>
<tr><td><b>Pandemic</b></td><td>Worldwide occurrence — affects multiple countries or continents.</td></tr></table>` },

{ t: "Malaria — Vector, Agents & Pathophysiology", h: `
<p><b>Type:</b> Protozoan, vector-borne. <b>Vector:</b> female <i>Anopheles minimus flavirostris</i>. <b>MOT:</b> bite of infected female Anopheles. <b>Incubation:</b> 10–12 days.</p>
<h4>4 characteristics of the malaria mosquito</h4>
<ul><li><b>Night-biting</b> — 9:00 PM to 3:00 AM</li><li><b>High-flying</b></li><li><b>Free-flowing water</b> — breeds between tall grasses along river banks</li><li><b>Rural</b> areas</li></ul>
<h4>5 causative agents (Plasmodium)</h4>
<ol><li><b>P. falciparum</b> — most malignant, most fatal, hardest to kill</li><li>P. ovale</li><li>P. malariae</li><li>P. vivax</li><li>P. knowlesi</li></ol>
<h4>Pathophysiology</h4>
<div class="flow"><span>Bite → <b>sporozoites</b> in blood</span><span>Liver: multiply → <b>schizonts</b></span><span>Schizonts rupture → <b>merozoites</b></span><span>Merozoites destroy RBCs → <b>hemolysis → anemia</b></span><span>TNF-α, IL-6, IL-8 → <b>cytokine storm → very high fever</b></span></div>
<h4>Cyclical stages (Cold → Hot → Wet)</h4>
<ul><li><b>Cold:</b> chills, shivering, chattering teeth</li><li><b>Hot:</b> high fever, reddened eyes & skin, warm skin</li><li><b>Wet:</b> diaphoresis (profuse sweating)</li></ul>
<div class="note">${FB} <b>Malarial cachexia</b> = extreme exhaustion/weakness from cyclical attacks & hypermetabolism. Priority: <b>nutritional support — ↑ carbohydrates, ↑ calories</b>.</div>` },

{ t: "Malaria — Diagnosis, Drugs & Prevention", h: `
<h4>Diagnostics</h4>
<ul><li><b>Peripheral Blood Smear (PBS)</b> — collect at the <b>height (peak) of fever</b>.</li>
<li><b>Thin smear = Qualitative</b> → identifies the <i>species</i>.</li>
<li><b>Thick smear = Quantitative</b> → <i>counts</i> the parasites.</li></ul>
<h4>Drugs</h4>
<table><tr><th>Drug</th><th>Notes</th></tr>
<tr><td><b>Chloroquine</b> ${FB}<br><small>chemoprophylaxis</small></td><td>500 mg weekly. Start 1–2 weeks <i>before</i> entering endemic area, continue until 6 weeks <i>after</i> leaving. Safe in pregnancy. <b>Not for P. falciparum</b> (resistance).</td></tr>
<tr><td><b>Artemether-Lumefantrine (Coartem)</b><br><small>first-line</small></td><td>140 mg 3x/day for 3 days (24 tablets total per lecture). <b>Contraindicated in 1st trimester</b> — teratogenic.</td></tr>
<tr><td><b>Quinine + Clindamycin</b></td><td>1st-trimester pregnancy / P. falciparum.</td></tr>
<tr><td><b>IV Artesunate</b></td><td>Severe malaria.</td></tr>
<tr><td>Others</td><td><b>Tetracycline</b> (emergency, large outbreaks); <b>Sulfadoxine</b> (emergency — watch for <b>neurotoxicity</b>: confusion, seizures, coma); Artemisinin; Mefloquine.</td></tr></table>
<h4>Collaborative management</h4>
<p>Bed rest • IVF (PNSS or LR) for losses from diaphoresis • oral fluids 3–4 L/day • high-carbohydrate, high-calorie diet • high vitamin C.</p>
<h4>Vector control</h4>
<ul><li>Long clothes at night, screens, mosquito nets, repellents</li><li>Plant <b>neem tree</b> & burn its leaves</li>
<li><b>Zooprophylaxis</b> — tie domestic animals near houses at night to divert mosquitoes</li>
<li><b>Stream clearing</b> — cut vegetation/grasses on river banks to expose breeding sites to sunlight</li>
<li><b>Stream seeding</b> — fishponds with larvivorous fish</li></ul>
<p><b>Larvivorous fish:</b> Mosquito fish (<i>Gambusia affinis</i>) ${FB}, Guppy (<i>Poecilia reticulata</i>), Tilapia. Stocking: immediate 2–4 fish/m²; delayed 200–400 fish/hectare.</p>` },

{ t: "Immunology Review (WBCs & Immunoglobulins)", h: `
<table><tr><th>Component</th><th>Function</th></tr>
<tr><td>Monocytes</td><td>Phagocytosis</td></tr>
<tr><td>Neutrophils</td><td>First responders; ↑ in acute (bacterial) infection</td></tr>
<tr><td>Eosinophils</td><td>Parasitic infections & allergic reactions</td></tr>
<tr><td>Basophils</td><td>Inflammation & allergic reactions</td></tr>
<tr><td>Lymphocytes</td><td>↑ in viral infection, tumor cells (B, T, NK cells)</td></tr>
<tr><td><b>IgM</b></td><td><b>First</b> antibody released in infection</td></tr>
<tr><td><b>IgA</b></td><td>Mucous linings (resp, GI), saliva, tears, <b>colostrum</b></td></tr>
<tr><td><b>IgG</b></td><td><b>Most abundant</b>; the only one that <b>crosses the placenta</b></td></tr>
<tr><td><b>IgE</b></td><td>Parasitic infections & allergies</td></tr>
<tr><td><b>IgD</b></td><td>Least understood; B-cell maturation</td></tr></table>` },

{ t: "Filariasis", h: `
<p>Parasitic, vector-borne; aka <b>Elephantiasis</b>. Targets the <b>lymphatic system</b> (lymph nodes & vessels).</p>
<p><b>Agents:</b> <i>Wuchereria bancrofti</i>, <i>Brugia malayi</i>, <i>Brugia timori</i>. Adult worm lifespan: 10 years. <b>Incubation: 8–16 months</b>.</p>
<h4>Vectors</h4>
<ul><li><i>W. bancrofti</i>: <b>Aedes poecilus</b> ${FB}, Culex quinquefasciatus, Aedes polynesiensis, Anopheles punctulatus</li>
<li><i>B. malayi</i>: Mansonia uniformis, Mansonia annulifera</li><li><i>B. timori</i>: Anopheles barbirostris</li></ul>
<div class="mn"><b>D-A-R-N</b> — Dark/Dirty/Dry areas • Abaca plantations (Bicol, Palawan) • Rural • Night-biting</div>
<h4>Pathophysiology</h4>
<div class="flow"><span>Bite → <b>microfilariae</b> into blood</span><span>Mature in blood 8–16 mo</span><span>Migrate to lymphatics → inflammation</span><span>Mechanical obstruction → <b>lymphedema / elephantiasis</b></span></div>
<h4>3 stages</h4>
<ol><li><b>Asymptomatic</b> — microfilariae circulating, no S/S</li>
<li><b>Acute — L-O-L</b> ${FB}: Lymphadenitis/lymphadenopathy • Orchitis • Lymphangitis</li>
<li><b>Chronic — H-E-L-L</b>: Hydrocele • Elephantiasis • Lymphedema</li></ol>
<h4>Diagnosis</h4>
<ul><li><b>Nocturnal blood smear</b> — microfilariae most active 10 PM–2 AM; collect from 8 PM onward</li>
<li><b>ICT (Immunochromatographic test)</b> — antigen test, can be done in the <b>daytime</b></li></ul>
<h4>Drugs</h4>
<ul><li><b>DOC: Diethylcarbamazine citrate (DEC / Hetrazan)</b> — 6 mg (per kg) ${FB}</li>
<li>Albendazole 400 mg (also roundworm, hookworm)</li><li>Mebendazole 100–600 mg (also pinworm)</li>
<li>Ivermectin 150 mcg — <b>never with Loa loa</b> (African eye worm) → <b>encephalopathy</b></li></ul>` },

{ t: "Leprosy (Hansen's Disease)", h: `
<p>Chronic bacterial infection. <b>Agents:</b> <i>Mycobacterium leprae</i>, <i>M. lepromatosis</i> (acid-fast bacilli). <b>MOT:</b> droplet (within 3 ft) & prolonged skin-to-skin contact.</p>
<div class="flow"><span>Droplets → nasopharynx</span><span>Lymph nodes → blood</span><span>Cross blood-nerve barrier → PNS</span><span>Destroy <b>Schwann cells</b> → demyelination → loss of sensation & deformities</span></div>
<p><b>Diagnostic:</b> <b>Slit skin smear</b> — tissue fluid from lesion examined for acid-fast bacilli.</p>
<table><tr><th></th><th>Paucibacillary (PB)</th><th>Multibacillary (MB)</th></tr>
<tr><td>Types</td><td>Tuberculoid, Indeterminate</td><td>Lepromatous, Borderline</td></tr>
<tr><td>Infectivity</td><td>Few bacilli, not highly infectious</td><td>Many bacilli, highly infectious</td></tr>
<tr><td>Lesions</td><td>&lt; 5</td><td>&gt; 5</td></tr>
<tr><td>Incubation</td><td>2–5 years</td><td>5–12 years</td></tr>
<tr><td>Treatment</td><td>6–9 months</td><td>24–30 months</td></tr>
<tr><td>Adult MDT</td><td>Day 1: Rifampicin 600 + Dapsone 100<br>Days 2–28: Dapsone 100</td><td>Day 1: Rif 600 + Dapsone 100 + Clofazimine 300<br>Days 2–28: Dapsone 100 + Clofazimine 50</td></tr>
<tr><td>Child MDT</td><td>Day 1: Rif 450 + Dapsone 50<br>Days 2–28: Dapsone 50</td><td>Day 1: Rif 450 + Dapsone 50 + Clofazimine 150<br>Days 2–28: Dapsone 50 + Clofazimine 50</td></tr></table>
<div class="mn"><b>Early — C-L-U-M-P-T:</b> Change in skin color • Loss of sensation & sweating • Ulcers that don't heal • Muscle weakness • Painful red eyes • Thickened nerves</div>
<div class="mn"><b>Late — M-L-C-C-S-E:</b> Madarosis (no eyebrows/lashes) • Lagophthalmos (can't close eyelids) • Contractures • Clawing of fingers/toes • Sinking nose bridge (saddle nose) • Enlarged breast (gynecomastia)</div>` },

{ t: "BCG Vaccine & Cold Chain", h: `
<ul><li><b>Content:</b> live attenuated bacteria</li>
<li><b>Contraindications:</b> immunocompromised, HIV+, chemotherapy, corticosteroids ("-sone" drugs)</li>
<li><b>Dose/route:</b> <b>0.05 mL intradermal (ID)</b> at birth ${FB}; school entry (Grade 1): 0.10 mL ID</li>
<li><b>Side effects:</b> local soreness (warm compress), fever (paracetamol), <b>permanent scar</b> ${FB}</li>
<li><b>Storage:</b> body of refrigerator, <b>+2 to +8 °C</b>. (OPV & MMR: freezer, −15 to −25 °C)</li>
<li><b>Reconstitution</b> ${FB}: freeze-dried powder + <b>2 mL</b> sterile water using a <b>5 cc syringe</b>; <b>discard after 4 hours</b>. FEFO = First Expiry, First Out.</li></ul>
<table><tr><th>Level</th><th>Max storage</th></tr><tr><td>Regional</td><td>6 months</td></tr><tr><td>Provincial</td><td>3 months</td></tr><tr><td>RHU</td><td>1 month</td></tr><tr><td>Transport box</td><td>3–5 days</td></tr></table>
<p><b>Other prevention:</b> droplet precautions (≥3 ft, mask); boil soiled linens 15–30 minutes before washing.</p>` },

{ t: "Dengue Hemorrhagic Fever", h: `
<p>Viral, vector-borne; aka <b>Breakbone fever</b> (severe arthralgia). <b>Agent:</b> Dengue virus types 1–4 (Flavivirus). <b>Incubation:</b> 6 days–1 week. <b>Vector:</b> female <i>Aedes aegypti</i> / <i>Aedes albopictus</i>.</p>
<div class="mn"><b>D-L-S-M</b> — Day-biting • Low-flying (most victims are children) • Stagnant clear water • Metropolitan/urban</div>
<div class="flow"><span>Bite → virus in blood</span><span>Viremia → cytokines → fever, breakbone pain</span><span>↑ capillary permeability → <b>plasma leakage</b></span><span>Platelet destruction → <b>thrombocytopenia</b> → petechiae, bleeding</span></div>
<h4>Diagnostics</h4>
<ol><li>ELISA</li><li>RT-PCR</li><li><b>Tourniquet (Rumpel-Leede) test</b> — BP cuff inflated midway between systolic & diastolic for <b>5 minutes</b>; count petechiae in a <b>1-inch square</b> below the antecubital fossa (assesses capillary fragility).</li></ol>` }
],
cards: [

<p><b>Conflict types:</b> intrapersonal (within self) • interpersonal (2 people) • intragroup (within team) • intergroup (between groups).</p>
<table><tr><th>Style</th><th>Meaning</th><th>Outcome</th></tr>
<tr><td>Collaborating</td><td>Work together to solve</td><td>Win–Win</td></tr>

<tr><td>Avoiding</td><td>Withdraw/ignore</td><td>Lose–Lose</td></tr>

<p>Delegation = assigning a task to competent personnel; <b>responsibility is transferred, accountability is retained</b>.</p>
<p><b>5 Rights:</b> Task • Circumstance • Person • Direction/Communication • Supervision/Evaluation.</p>
<div class="mn"><b>RN never delegates — U-E-A-T:</b> Unstable clients • Evaluation • Assessment (initial) • Teaching (initial). Also RN-only: IV push, blood transfusion, central line meds (chemo, TPN).</div>

<tr><td>CV</td><td><b>Flat neck veins</b>; ↓ CO; <b>narrow pulse pressure</b> (&lt; 30)</td></tr>

<tr><td>Renal/GI</td><td>UO <b>&lt; 30 mL/hr</b>; concentrated urine, <b>USG &gt; 1.030</b>; constipation; weight loss; oliguria 100–400 mL/day; anuria &lt; 100 mL/day</td></tr>
<tr><td>Skin</td><td>Poor turgor, dry skin & mucosa</td></tr>
<tr><td>VS</td><td>"Shock triad": hypotension + tachycardia + tachypnea; may be hypothermic</td></tr>
<tr><td>Labs</td><td><b>CVP &lt; 3</b>; <b>Hct &gt; 52%</b> (hemoconcentration); BUN &gt; 20; creatinine &gt; 1.2</td></tr></table>
<p><b>Management:</b> ABCs; ↑ oral fluids if safe; isotonic IVF (<b>PNSS 0.9% NaCl, LR</b>); strict I&O, daily weight; treat cause; escalate shock.</p>` },

{ t: "Hypervolemia (Fluid Volume Excess)", h: `
<p><b>Causes:</b> kidney failure, liver failure (ascites), fluid shifting, CHF, SIADH, Cushing syndrome.</p>
<div class="flow"><span>Retention → ↑ ECF</span><span>↑ hydrostatic pressure</span><span>Fluid to interstitium → edema</span><span>Lungs → pulmonary edema → dyspnea, hypoxemia</span></div>
<table><tr><th>System</th><th>Findings</th></tr>
<tr><td>Neuro</td><td>Confusion, ↓ LOC; newborn: <b>bulging fontanelles</b>; severe → ↑ ICP</td></tr>
<tr><td>CV</td><td><b>Distended neck veins (JVD)</b>; Cushing triad (HTN + bradycardia + bradypnea) = late sign of ↑ ICP</td></tr>
<tr><td>Resp</td><td>Dyspnea, cough, <b>crackles</b>, pulmonary edema</td></tr>
<tr><td>Renal/GI</td><td>UO &gt; 30 mL/hr; <b>USG &lt; 1.010</b>; weight gain</td></tr>
<tr><td>Skin</td><td>Pitting / non-pitting edema</td></tr>
<tr><td>Labs</td><td><b>CVP &gt; 8</b>; <b>Hct &lt; 35%</b> (hemodilution)</td></tr></table>
<p><b>Management:</b> restrict fluid & sodium as prescribed; strict I&O, daily weight; lung sounds & O₂; diuretics (monitor K, Na, renal function). Lecture lists IV albumin & digoxin for CHF.</p>` },

{ t: "Pulmonary Tuberculosis", h: `
<p><b>Agents:</b> <i>Mycobacterium tuberculosis</i> (also <i>M. africanum</i>, <i>M. bovis</i>) — acid-fast bacilli. <b>Incubation:</b> 2–10 weeks. <b>MOT:</b> airborne → <b>negative-pressure room</b> (≥ 6 air exchanges/hr), <b>N95</b> mask.</p>
<p><b>Types:</b> active, latent (infected, no S/S), pulmonary, extrapulmonary.</p>
<div class="flow"><span>Inhaled droplets → alveoli</span><span>Macrophages engulf</span><span>Wall-off → <b>granuloma (tubercle)</b></span><span><b>Caseating necrosis</b></span><span>Liquefies → <b>cavitary lesion</b> on CXR</span></div>
<p><b>S/S:</b> hemoptysis, chest/back pain, anorexia, weight loss, <b>night sweats</b>, <b>low-grade afternoon fever</b>, fatigue.</p>
<h4>Diagnostics</h4>
<ul><li><b>Mantoux / TST:</b> 0.1 mL PPD <b>ID</b> inner left forearm; read in <b>48–72 hrs</b>. Positive <b>≥ 5 mm</b>: HIV, immunocompromised, close contacts, transplant. <b>≥ 10 mm</b>: health workers, immigrants, children &lt; 4–5 yrs.</li>
<li><b>Sputum AFB:</b> 3 early-morning samples; rinse with plain water only — no mouthwash/toothbrushing. Confirmatory.</li>
<li><b>GeneXpert MTB/RIF:</b> molecular; results 90 min–24 hrs; detects TB DNA & <b>rifampicin resistance</b> (rpoB gene).</li>
<li><b>CXR:</b> remove jewelry/metal.</li></ul>` },

{ t: "TB-DOTS, Regimens & Drug Toxicities", h: `
<p><b>DOTS</b> — health worker directly watches the patient swallow every dose.</p>
<p><b>Classifications:</b> New • Relapse (cured, then positive again) • Treatment failure (still + after 6 mo) • TALF (treatment after loss to follow-up) • PTOU (previous outcome unknown) • Others.</p>
<table><tr><th>Category</th><th>Who</th><th>Regimen</th></tr>
<tr><td><b>I</b> (6 mo)</td><td>All new cases</td><td><b>2 HRZE + 4 HR</b></td></tr>
<tr><td><b>II</b></td><td>Retreatment (relapse, failure, TALF, PTOU)</td><td>2 HRZES + 1 HRZE + maintenance (adds <b>Streptomycin</b>)</td></tr>
<tr><td>4-month WHO</td><td>Shorter regimen</td><td>2 HPZM + 2 HPM (rifapentine, moxifloxacin)</td></tr>
<tr><td><b>IV / MDR-TB</b></td><td>Still culture + after retreatment</td><td><b>BPaLM</b>: Bedaquiline, Pretomanid, Linezolid, Moxifloxacin (6 mo)</td></tr></table>
<table><tr><th>Drug</th><th>Toxicity</th><th>Nursing action</th></tr>
<tr><td>All</td><td>Hepatotoxicity</td><td>Monitor ALT/AST, jaundice</td></tr>
<tr><td><b>Rifampicin</b></td><td><b>Red-orange</b> urine, tears, sweat</td><td>Reassure harmless; stop if jaundice</td></tr>
<tr><td><b>Isoniazid</b></td><td><b>Peripheral neuritis</b></td><td>Give <b>Vitamin B6 (pyridoxine)</b></td></tr>
<tr><td><b>Pyrazinamide</b></td><td><b>Hyperuricemia</b></td><td>Monitor uric acid; avoid purines (munggo, liver, dinuguan, sardines)</td></tr>
<tr><td><b>Ethambutol</b></td><td><b>Optic neuritis</b> (blue-green color blindness)</td><td>Visual acuity, <b>Ishihara</b> chart</td></tr>
<tr><td><b>Streptomycin</b></td><td><b>Ototoxicity</b> (CN VIII) & nephrotoxicity</td><td>Tinnitus, vertigo; BUN & creatinine</td></tr></table>` },

<tr><td>B12 (cobalamin)</td><td><b>Pernicious anemia</b></td></tr></table>` },

{ t: "Diphtheria & Pertussis", h: `
<h4>Diphtheria</h4>
<p><b>Agent:</b> <i>Corynebacterium diphtheriae</i> (Klebs-Löffler bacillus). <b>IP:</b> 2–5 days. <b>MOT:</b> droplet, indirect contact, unpasteurized milk.</p>
<div class="flow"><span>Colonizes nose/pharynx/larynx</span><span>Exotoxin → mucosal necrosis</span><span><b>Pseudomembrane</b> (pathognomonic)</span><span>Cervical nodes → <b>"bull neck"</b></span></div>
<ul><li><b>Throat culture</b> — confirms bacteria</li><li><b>Elek test</b> — confirms toxin production</li>
<li><b>Schick test</b> — susceptibility/immunity: 0.1 mL toxin ID; read 48–72 hrs; ≥ 10 mm = susceptible</li></ul>
<p><b>DOC:</b> Erythromycin or Penicillin + diphtheria antitoxin. Droplet precautions; boil linens 15–30 min.</p>
<p><small>Pasteurization: 63 °C × 30 min; 72 °C × 15 sec; 138–140 °C × 1–2 sec.</small></p>
<h4>Pertussis (whooping cough)</h4>
<p><b>Agent:</b> <i>Bordetella pertussis</i> (Bordet-Gengou bacillus). <b>IP:</b> 7–10 days. Droplet.</p>
<div class="flow"><span>Colonizes ciliated airway</span><span>Toxin paralyzes cilia</span><span>Thick mucus</span><span>Paroxysmal cough + <b>inspiratory "whoop"</b></span></div>
<ol><li><b>Catarrhal</b> (7–14 days) — <b>most contagious</b>; looks like a cold</li>
<li><b>Paroxysmal/spasmodic</b> (2–6 weeks) — whoop, bulging eyes, distended neck veins, umbilical protrusion</li></ol>
<p><b>Dx:</b> nasopharyngeal swab. <b>DOC:</b> macrolides — azithromycin, erythromycin, clarithromycin.</p>` },

{ t: "Tetanus Neonatorum & ICP", h: `
<p><b>Agent:</b> <i>Clostridium tetani</i> — anaerobic, spore-forming (spores survive boiling → autoclave). From soil, rusty metal, unsterile instruments. <b>IP:</b> 3–21 days. <b>MOT:</b> cutting the cord with unsterile instruments / dirty substances on the stump.</p>
<div class="flow"><span>Spores in umbilical stump</span><span>Toxin <b>tetanospasmin</b></span><span>Travels to CNS</span><span>Blocks <b>GABA & glycine</b></span><span>Unopposed spasms</span></div>
<div class="mn"><b>Classic triad:</b> <b>Trismus</b> (lockjaw) • <b>Risus sardonicus</b> (sardonic grin) • <b>Opisthotonus</b> (arched back). Also inability to suck/breastfeed.</div>
<p><b>Spatula test:</b> touch posterior pharynx — positive = <b>bites down</b> on spatula (normal = gag).</p>
<p><b>DOC:</b> IV <b>Metronidazole</b> + <b>Tetanus immune globulin (TIG)</b>.</p>
<p><b>Priority:</b> safety & seizure prevention — <b>dark, cool, quiet room</b> (light/noise trigger spasms). Cerebral cortex tolerates hypoxia 4–6 min; medulla 10–15 min.</p>
<h4>↑ ICP</h4>
<ul><li>Osmotic diuretic DOC: <b>Mannitol</b>; cerebral edema: <b>Dexamethasone</b>; hydrocephalus: <b>Acetazolamide</b></li>
<li><b>Avoid:</b> coughing, sneezing, bending, Valsalva, over-suctioning, rectal exams</li></ul>` }

{ t: "Hepatitis B", h: `
<p><b>Agent:</b> HBV. <b>IP:</b> 60–150 days (avg 90). Targets <b>hepatocytes</b> (RUQ).</p>
<p><b>MOT:</b> perinatal/vertical, sexual, sharing razors, blood/blood products, needlestick.</p>
<p><b>Bile:</b> liver makes ~600 mL/day; gallbladder stores & concentrates it. Fatty meal → duodenum releases <b>cholecystokinin (CCK)</b> → gallbladder contracts → bile to duodenum → emulsifies fat.</p>
<div class="note">${FB} <b>Gastric emptying:</b> CHO 1–2 hrs • Protein 3–4 hrs • Fat 4–6 hrs. Post-gastrectomy → dumping syndrome → avoid simple carbs.</div>
<div class="flow"><span>Virus invades hepatocytes</span><span>Inflamed liver (RUQ pain)</span><span>Bile backs up (cholestasis)</span><span>↑ bilirubin → <b>jaundice, pruritus</b></span></div>
<ul><li>Kidneys filter bilirubin → <b>tea-colored urine</b></li><li>No bile to gut (no stercobilin) → <b>clay-colored stools</b></li><li>Poor fat digestion → <b>steatorrhea</b></li></ul>
<h4>Serology ${FB}</h4>
<table><tr><th>Marker</th><th>Meaning</th></tr>
<tr><td><b>HBsAg</b></td><td>Active / current infection</td></tr>
<tr><td><b>Anti-HBs</b></td><td><b>Immunity</b> (vaccine or recovery)</td></tr>
<tr><td><b>Anti-HBc</b></td><td>Past / previous infection</td></tr>
<tr><td><b>HBeAg</b></td><td>Active replication — <b>highly infectious</b></td></tr></table>
<p><b>Management:</b> bed rest; NPO during vomiting; vitamin C; <b>high-carb, low-fat</b> diet (avoid fatty meals); chronic HBV DOC: <b>Tenofovir</b>; prevention: Hep B vaccine.</p>
<h4>Needle safety & waste bins ${FB}</h4>
<p><b>Never recap needles</b>; discard immediately in puncture-proof sharps container.</p>
<table><tr><th>Color</th><th>Waste</th></tr>
<tr><td>Black</td><td>Dry non-infectious (paper)</td></tr><tr><td>Green</td><td>Wet non-infectious (food, biodegradable)</td></tr>
<tr><td>Red</td><td>Sharps / needles</td></tr><tr><td>Yellow</td><td>Infectious & pathologic (soiled dressings, body parts)</td></tr>
<tr><td>Yellow w/ black band</td><td>Chemical & pharmaceutical</td></tr><tr><td>Orange</td><td>Radioactive</td></tr></table>` },

{ t: "Poliomyelitis", h: `
<p>AKA <b>Heine-Medin disease</b>, Legio debilitans. <b>Agent:</b> poliovirus (enterovirus) — Type 1 <b>Brunhilde</b> (most paralytic), Type 2 Lansing, Type 3 Leon.</p>
<p><b>IP:</b> non-paralytic 3–6 days; paralytic 7–21 days. <b>MOT:</b> fecal-oral (5 Fs: fingers, food, feces, flies, fomites) & droplet.</p>
<div class="flow"><span>Ingested/inhaled</span><span>Blood → crosses BBB</span><span>Destroys <b>anterior horn cells</b> (lower motor neurons)</span><span><b>Asymmetrical flaccid paralysis</b> (pathognomonic)</span></div>
<p><b>Bulbar involvement</b> → paralysis of intercostals & diaphragm → respiratory failure (prepare O₂, suction, intubation set).</p>

<p><b>Care:</b> supportive; bed rest; <b>NO aspirin</b> (Reye's syndrome). Prevention: OPV, IPV.</p>` },

{ t: "Mumps", h: `
<p>AKA <b>epidemic parotitis</b>. <b>Agent:</b> paramyxovirus. <b>IP:</b> 12–26 days. Droplet, direct contact, fecal-oral.</p>
<p><b>Parotid glands</b> (in front of/below ears) → <b>parotitis</b> (pathognomonic). Other glands: sublingual, submandibular.</p>
<p><b>Complications:</b> orchitis, oophoritis, pancreatitis, meningitis/encephalitis, myocarditis.</p>
<p><b>Dx:</b> mumps IgM/IgG, RT-PCR. <b>S/S:</b> fever, dysphagia, odynophagia, parotid swelling.</p>
<ul><li>Soft bland diet — <b>avoid sour/citrus</b>, hard, salty foods (stimulate saliva → pain)</li>
<li>Paracetamol; <b>no aspirin</b></li><li><b>Cold compress</b> 20 min on / 20 min off</li>
<li>Steroids: hydrocortisone 300 mg/day × 1–2 days → 100 mg × 3–5 days (alt: prednisone 40–60 mg)</li>
<li><b>Orchitis:</b> <b>elevate/support the scrotum</b> (towel, athletic supporter)</li></ul>` },

{ t: "Measles (Rubeola)", h: `
<p>AKA 7-day / red / English measles. <b>Agent:</b> rubeola virus (Morbillivirus). <b>IP:</b> 10–14 days. <b>MOT:</b> <b>airborne</b> (N95, negative-pressure), droplet, fomites.</p>
<ol><li><b>Prodromal:</b> fever, coryza, conjunctivitis; <b>Stimson's line</b> (lower lid margin); <b>Koplik's spots</b> — red spots with bluish-white centers on buccal mucosa opposite lower molars (<b>pathognomonic</b>)</li>
<li><b>Eruptive:</b> maculopapular <b>morbilliform rash</b>, <b>cephalocaudal</b> (behind ears → face → trunk → extremities), lesions stay <b>discrete</b>; then <b>branny desquamation</b></li></ol>
<p><b>Care:</b> antipyretics, calamine lotion, bed rest in a <b>dim room</b> (photophobia).</p>
<table><tr><th>Vitamin A dose</th><th>Capsule</th></tr>
<tr><td>&lt; 6 months — 50,000 IU</td><td>—</td></tr><tr><td>6–11 months — 100,000 IU</td><td><b>Blue</b></td></tr>

<div class="mn">${FB} <b>Complications — DOPE:</b> Diarrhea • Otitis media • <b>Pneumonia</b> (most common cause of death in young children) • Encephalitis</div>` },

{ t: "German Measles (Rubella)", h: `
<p>AKA <b>3-day measles</b>. <b>Agent:</b> rubella virus (Togaviridae). <b>IP:</b> 14–21 days. Droplet, indirect contact.</p>
<ul><li><b>Postauricular & suboccipital lymphadenopathy</b></li><li><b>Forchheimer's spots</b> — red petechiae on the <b>soft palate</b></li>
<li>Rash starts on face, spreads down, and <b>coalesces</b>; low-grade fever, arthralgia</li></ul>
<h4>Congenital Rubella Syndrome (1st trimester)</h4>
<p>Virus crosses placenta → disrupts organogenesis → <b>cataracts, sensorineural deafness, congenital heart defects (PDA)</b>, intellectual disability.</p>
<p><small>IQ: ≥131 gifted • 111–130 above average • 90–110 average • 71–89 sub-average • 50–70 mild MR.</small></p>
<p><b>Care:</b> supportive, no aspirin. MMR is live — <b>not for pregnant</b> or immunocompromised.</p>` },

{ t: "Hib & Bacterial Meningitis", h: `
<p><b>Hib</b> — gram-negative coccobacillus; leading cause of bacterial meningitis in young children. <b>IP:</b> 2–10 days. Droplet.</p>
<p><b>Meninges:</b> <b>Dura</b> (outer, protective) • <b>Arachnoid</b> (middle, CSF circulates beneath it) • <b>Pia</b> (inner, nourishes brain).</p>
<div class="flow"><span>Nasopharynx</span><span>Blood → crosses BBB</span><span>Meningeal inflammation</span><span>Cerebral edema → <b>↑ ICP</b></span></div>
<h4>Lumbar puncture</h4>
<ul><li>Site: <b>L3–L4, L4–L5</b> (or L5–S1). Before: consent, <b>void</b>.</li>

<li>After: <b>flat (supine, no pillow) 6–8 hours</b> to prevent post-spinal headache</li>
<li>Cloudy CSF = bacterial infection; reddish = subarachnoid hemorrhage</li></ul>
<div class="note">${FB} <b>CSF in bacterial meningitis:</b> <b>↑ WBC</b>, <b>↓ glucose</b> (bacteria consume it), <b>↑ protein</b>.</div>
<p><b>Queckenstedt test:</b> compress jugular vein → normal = rapid rise in CSF pressure; <b>no rise = spinal block</b>.</p>
<p><b>↑ ICP:</b> earliest sign = <b>restlessness</b>; headache, projectile vomiting. Semi-Fowler's 30°, head neutral, dark quiet room, padded rails.</p>
<p><b>Drugs:</b> Mannitol (↑ ICP) • Dexamethasone (cerebral edema) • <b>Ceftriaxone</b> (antibacterial DOC, ± vancomycin) • Phenytoin / carbamazepine (seizures).</p>` },

<p>Leading cause of severe watery diarrhea in infants. <b>IP:</b> 2 days. <b>MOT:</b> fecal-oral. Destroys <b>small-intestine villi</b> → malabsorption of water & electrolytes → explosive watery diarrhea → dehydration.</p>

{ t: "Neurologic: EEG, MRI, Lumbar Puncture", h: `
<h4>EEG — electrical activity of the brain</h4>
<p>For seizures, sleep disorders, encephalopathy, coma. ~21–25 scalp electrodes; 15–60 min; supine.</p>
<ul><li><b>Before:</b> explain; <b>shampoo hair</b> (oil blocks signals); <b>avoid for 24 hrs:</b> coffee, tea, alcohol, sedatives, barbiturates, tranquilizers, anticonvulsants</li>
<li><b>After:</b> remove paste & shampoo; assess neuro status & LOC</li></ul>
<h4>MRI — magnetic field & radio waves</h4>
<ul><li><b>Contraindications:</b> any metal implant, <b>pacemaker</b>, cochlear implant, aneurysm clips</li>
<li>Assess for <b>claustrophobia</b>; warn of loud knocking noises</li><li>Remove credit/ATM cards (erased); ask about <b>tattoos</b> with metallic ink (burns)</li></ul>
<h4>Lumbar puncture</h4>
<p>L3–L4, L4–L5, L5–S1; 2–3 sterile tubes × 1–2 mL. Gold standard for bacterial meningitis. Clear = normal; cloudy = infection; reddish = subarachnoid hemorrhage.</p>
<p><b>Before:</b> consent, void, lidocaine. <b>Position:</b> fetal, knee-chest or sitting. <b>After:</b> <b>flat 6–8 hrs</b>; post-spinal headache → bed rest, ice, analgesics.</p>
<table><tr><th>CSF</th><th>Normal</th><th>Bacterial infection</th></tr>
<tr><td>Pressure</td><td>70–180 mmH₂O</td><td>↑ in ↑ ICP</td></tr><tr><td>Glucose</td><td>50–80 mg/dL</td><td><b>↓</b></td></tr>
<tr><td>Protein</td><td>20–50 mg/dL</td><td><b>↑</b></td></tr><tr><td>WBC</td><td>0–5 cells/µL</td><td><b>↑</b></td></tr></table>` },

{ t: "GI: Barium Studies & Endoscopy", h: `
<table><tr><th>Test</th><th>Prep & key points</th></tr>
<tr><td><b>Upper GI series</b><br><small>barium swallow</small></td><td>Esophagus → jejunum. Low-residue diet 2–3 days; <b>NPO 6–8 hrs</b>. After: <b>white chalky stool 48–72 hrs</b>; barium causes <b>constipation</b> → laxative + ↑ fluids.</td></tr>
<tr><td><b>Lower GI series</b><br><small>barium enema</small></td><td>Colon & rectum via rectum. Clear liquids 2–3 days; laxative/cleansing enema; <b>GoLYTELY</b> 290 mL every 10 min for 2 hrs → watery stool.</td></tr>
<tr><td><b>EGD</b><br><small>upper endoscopy</small></td><td>Consent; NPO 6–8 hrs; <b>atropine</b> (dry secretions/↓ gag), diazepam, remove dentures, <b>lidocaine spray</b>. After: <b>side-lying, NPO until gag reflex returns</b>; watch for bleeding/perforation; no driving 12–24 hrs.</td></tr>
<tr><td><b>Colonoscopy</b></td><td>Gold standard for colorectal cancer; screening from <b>45 years</b> (every 10 yrs low-risk). Clear liquids, GoLYTELY, sedation. Position: <b>left side-lying (Sims')</b>. After: watch <b>vasovagal response</b> (bradycardia, hypotension) & perforation (rigid abdomen); sitz bath.</td></tr></table>
<p><b>Stool consistency:</b> ascending = liquid • transverse = mushy • descending = formed • sigmoid = hard.</p>
<h4>Guaiac / Hemoccult (occult blood)</h4>
<p>3 stool samples on 3 days; hydrogen peroxide reagent → <b>blue ring = positive</b>. Avoid for 48 hrs: red meat, fish, poultry, eggs; cauliflower, broccoli, melon (peroxidase); NSAIDs/aspirin; <b>iron</b> (black stool); <b>vitamin C</b>.</p>` },

{ t: "Hepatobiliary: Liver Biopsy, ERCP, Cholecystogram", h: `
<h4>Anticoagulant labs</h4>
<table><tr><th></th><th>Warfarin (Coumadin)</th><th>Heparin</th></tr>
<tr><td>Monitor</td><td><b>PT / INR</b></td><td><b>aPTT / PTT</b></td></tr>
<tr><td>Therapeutic</td><td>1.5–2 × normal</td><td>1.5–2.5 × normal</td></tr>
<tr><td>Antidote</td><td><b>Vitamin K</b></td><td><b>Protamine sulfate</b></td></tr>
<tr><td>Notes</td><td>Limit green leafy vegetables (vit K)</td><td>SC: don't aspirate, don't massage; abdomen</td></tr></table>
<h4>Liver biopsy</h4>
<ul><li>Before: consent; NPO 3–4 hrs; check PT/INR, platelets; vitamin K if ordered</li>
<li>During: supine/left side with right arm raised; <b>exhale and hold breath 5–10 sec</b> during insertion (immobilizes diaphragm)</li>
<li>After: <b>lie on the RIGHT side</b> (pressure on site) ; bed rest 24 hrs; watch for bleeding & peritonitis</li></ul>
<h4>ERCP</h4>
<p>Scope + iodinated dye: mouth → duodenum → sphincter of Oddi → ampulla of Vater → bile & pancreatic ducts.</p>
<ul><li>Check <b>iodine/shellfish allergy</b> (epinephrine at bedside)</li><li><b>Hold metformin 48 hrs</b> → prevents lactic acidosis</li>
<li>After: NPO until gag reflex returns; watch for <b>acute pancreatitis</b> (epigastric pain radiating to back)</li></ul>
<h4>Oral cholecystogram (gallbladder series)</h4>
<ul><li>6 Telepaque tablets the evening before, one every 5 min with water</li><li><b>Fat-free dinner</b> (fat triggers CCK → gallbladder empties), then NPO after midnight</li>
<li>Expect 2–3 loose stools. <b>Gallbladder not visualized</b> after 60–90 min = cystic duct obstruction</li>
<li>Contrast is nephrotoxic — check BUN/creatinine</li></ul>` },

{ t: "Paracentesis", h: `
<p>Aspiration of <b>ascitic fluid</b> from the peritoneal cavity. Ascites in cirrhosis from: (1) <b>portal hypertension</b> (↑ hydrostatic pressure) and (2) <b>hypoalbuminemia</b> (↓ oncotic pressure).</p>
<p><b>Assessment:</b> fluid wave test.</p>
<ul><li>Before: consent; baseline VS & weight; <b>void immediately before</b> (avoid bladder puncture)</li>
<li>Position: upright/semi-Fowler's (or per protocol)</li>
<li>Remove 1–2 L/day; large-volume (≥ 2–3 L) → give <b>IV albumin</b> to prevent hypovolemia</li>
<li>Watch for <b>hypovolemic shock</b>: hypotension, tachycardia</li></ul>` },

{ t: "Total Parenteral Nutrition (TPN)", h: `
<p>All nutrients IV via central line when the GI tract can't be used. <b>Goal:</b> prevent <b>negative nitrogen balance</b>. Expected weight gain ~0.5 kg/day.</p>
<ul><li>Hypertonic; continuous over 24 hrs by <b>infusion pump</b>; room temperature</li>
<li><b>Never</b> hang a bag &gt; 24 hrs; change tubing every 24 hrs</li>
<li>Fat layer / cracked bag → <b>don't give</b> (fat embolism); return to pharmacy</li>
<li>Bag runs out → hang <b>D10W</b> to prevent <b>rebound hypoglycemia</b></li>
<li>Monitor blood glucose; mild hyperglycemia → regular insulin</li>
<li>Line: <b>subclavian vein</b> preferred; insertion in <b>Trendelenburg</b> + <b>Valsalva</b> (prevent air embolism)</li>
<li>Triple lumen: <b>medial lumen dedicated to TPN only</b></li>
<li>Dressing change 3×/week, chlorhexidine. Common infection: <b>Candida albicans</b>; sudden fever → blood cultures</li></ul>
<div class="note"><b>Air embolism</b> (sudden SOB, chest pain, hypotension, "mill-wheel" murmur): clamp line, 100% O₂, <b>left side-lying in Trendelenburg</b> (Durant's maneuver) to trap air in the right heart.</div>` },

{ t: "Colostomy Care", h: `
<p>Often after <b>abdominoperineal resection (Miles' procedure)</b>.</p>
<table><tr><th>Stoma</th><th>Meaning</th></tr>
<tr><td><b>Beefy red, moist</b></td><td>Normal (slight edema first 4–5 days)</td></tr>
<tr><td>Dusky, dark, black</td><td><b>Ischemia/necrosis</b> — notify surgeon</td></tr>
<tr><td>White</td><td>Candida — nystatin powder</td></tr></table>
<ul><li>Function begins in 5–7 days. Empty pouch when <b>⅓–½ full</b>.</li>
<li>Skin barrier (karaya, Stomahesive); wash with mild soap & water</li></ul>
<h4>Irrigation (sigmoid colostomy)</h4>
<ul><li>Same time daily, after a meal (gastrocolic reflex); sit on toilet</li>
<li><b>500–1,000 mL</b> lukewarm water/NSS; bag <b>12–18 inches</b> above stoma</li>
<li>Dilate with lubricated little finger; insert cone <b>2–3 inches</b></li>
<li><b>Cramping → clamp/stop</b> until it passes</li><li>Leave 5–10 min; drain 15–20 min</li></ul>
<p><b>Gas-forming foods to avoid:</b> cabbage, cauliflower, eggs, beans, carbonated drinks, dairy. <b>Reduce odor:</b> yogurt, parsley, buttermilk.</p>` },

{ t: "Bronchoscopy & Bronchography", h: `
<h4>Bronchoscopy</h4>
<ul><li>Consent; <b>NPO 6–8 hrs</b>; atropine, diazepam; remove dentures & jewelry; lidocaine spray (watch for anaphylaxis & toxicity — dysrhythmias)</li>
<li>Position: supine or semi-Fowler's</li>
<li>After: <b>side-lying, NPO until cough & gag reflex return</b>; <b>pink-tinged sputum is expected</b>; bright red hemoptysis = emergency</li></ul>
<h4>Bronchography (with dye)</h4>
<ul><li>Iodine allergy check, hold metformin 48 hrs, renal function</li>
<li>Positions: supine → Trendelenburg to coat airways</li>
<li>After: cough, deep breathing, <b>postural drainage/CPT</b> to clear dye; dry mouth from atropine expected</li>
<li>Uncleared dye → <b>chemical pneumonitis</b></li>
<li>CPT best: on waking, before meals, 2 hrs after meals, at bedtime</li></ul>` },

{ t: "ABG & Acid-Base (ROME)", h: `
<ul><li>Sites: <b>radial</b> (most common), brachial, femoral</li>
<li><b>Heparinized syringe</b>, 3–5 mL; put on <b>ice</b> immediately; pressure 5 min (10–15 if on anticoagulants)</li></ul>
<div class="mn"><b>Allen's test</b> (before radial puncture): compress radial & ulnar → clench fist until pale → <b>release ulnar only</b> → color returns in <b>≤ 6 sec</b> = adequate collateral circulation. Longer = don't use the radial artery.</div>
<table><tr><th></th><th>Normal</th><th>Acidosis</th><th>Alkalosis</th></tr>
<tr><td>pH</td><td>7.35–7.45</td><td>&lt; 7.35</td><td>&gt; 7.45</td></tr>
<tr><td>PaCO₂</td><td>35–45</td><td>&gt; 45</td><td>&lt; 35</td></tr>
<tr><td>HCO₃</td><td>22–26</td><td>&lt; 22</td><td>&gt; 26</td></tr>
<tr><td>PaO₂</td><td>80–100</td><td colspan="2">&lt; 80 = hypoxemia</td></tr></table>
<div class="mn"><b>ROME:</b> <b>R</b>espiratory <b>O</b>pposite (pH and PaCO₂ move opposite) • <b>M</b>etabolic <b>E</b>qual (pH and HCO₃ move the same way)</div>
<table><tr><th>Imbalance</th><th>Pattern</th><th>Causes</th><th>Care</th></tr>
<tr><td><b>Resp. acidosis</b></td><td>↓ pH, ↑ PaCO₂</td><td>Hypoventilation: COPD, asthma, CNS depression</td><td>Pursed-lip breathing</td></tr>
<tr><td><b>Resp. alkalosis</b></td><td>↑ pH, ↓ PaCO₂</td><td>Hyperventilation: anxiety, pain, fever, early aspirin overdose</td><td>Calm; rebreathe into paper bag</td></tr>
<tr><td><b>Metab. acidosis</b></td><td>↓ pH, ↓ HCO₃</td><td>Kidney failure, DKA, severe diarrhea</td><td>Treat cause</td></tr>
<tr><td><b>Metab. alkalosis</b></td><td>↑ pH, ↑ HCO₃</td><td>Vomiting, NGT suction, excess antacids</td><td>Treat cause</td></tr></table>` }

sections: [
{ t: "Thoracentesis", h: `
<p>Needle through chest wall into the <b>pleural space</b> to remove fluid or air. Indications: pleural effusion (fluid), pneumothorax (air), hydrothorax (water), <b>empyema (pus)</b>.</p>
<ul><li><b>Before:</b> consent, CXR, baseline VS, check <b>lidocaine</b> allergy</li></ul>
<div class="mn">${FB} <b>Position during:</b> (1) <b>sitting upright, leaning forward</b> over a padded overbed table, or (2) lying on the <b>unaffected side</b> with HOB 30–45°.</div>
<ul><li><b>During:</b> stay still, don't cough; <b>exhale and hold breath 5–10 sec</b> during insertion</li>
<li><b>After:</b> pressure + sterile dressing; lie on the <b>unaffected side ~1 hr</b>; bed rest until VS stable</li></ul>
<div class="note"><b>Tension pneumothorax</b> (from puncture): <b>trachea deviates AWAY</b> from the affected side, absent breath sounds on affected side, hypotension, SOB.</div>
<p><b>Watch for:</b> bloody sputum, syncope, dizziness, hypoxemia (early: restlessness, tachycardia, tachypnea; late: cyanosis, confusion), fever.</p>` },

{ t: "Urinalysis", h: `
<p><b>Discard first-voided urine</b> — collect a <b>midstream clean catch</b>.</p>
<table><tr><th>Color</th><th>Meaning</th></tr>
<tr><td>Amber</td><td>Normal</td></tr><tr><td>Red/smoky</td><td>Hematuria; <b>painless hematuria = bladder cancer</b></td></tr>
<tr><td>Cloudy</td><td>Infection (cystitis, pyelonephritis)</td></tr><tr><td>Colorless</td><td>Overhydration</td></tr>
<tr><td>Dark yellow/orange</td><td>Dehydration</td></tr>
<tr><td>Red-orange</td><td><b>Rifampicin</b>, phenytoin, <b>pyridium</b>, thorazine</td></tr>
<tr><td>Blue-green</td><td><b>Amitriptyline (Elavil)</b></td></tr>
<tr><td>Brown / black</td><td>Nitrofurantoin / Lysol poisoning</td></tr></table>
<table><tr><th>Parameter</th><th>Normal</th><th>Abnormal</th></tr>
<tr><td>Odor</td><td>Aromatic</td><td>Foul = infection; <b>fruity = DKA</b></td></tr>
<tr><td>pH</td><td>4.5–7.2</td><td></td></tr>
<tr><td>SG</td><td>1.010–1.030</td><td>↑ dehydration; ↓ overhydration</td></tr>
<tr><td>Glucose</td><td>Negative</td><td>DM</td></tr>
<tr><td>Protein</td><td>Negative/trace</td><td>PIH; AGN (mild, cola-colored urine); <b>nephrotic syndrome (massive, foamy)</b></td></tr>
<tr><td>Volume</td><td>&gt; 400 mL/day</td><td>Oliguria &lt; 400 (AKI); polyuria (DM, DI); nocturia/dribbling (BPH)</td></tr></table>` },

{ t: "ADH Disorders, Nephrotic Syndrome & Labs", h: `
<p><b>ADH</b> is made in the <b>hypothalamus</b>, stored/released by the <b>posterior pituitary</b>.</p>
<table><tr><th></th><th>Diabetes insipidus</th><th>SIADH</th></tr>
<tr><td>ADH</td><td><b>Deficient</b></td><td><b>Excess</b></td></tr>
<tr><td>Urine</td><td><b>Polyuria</b>, dilute</td><td><b>Oliguria</b>, concentrated</td></tr>
<tr><td>Fluid</td><td>Dehydration</td><td>Water retention</td></tr>
<tr><td>Sodium</td><td><b>Hypernatremia</b></td><td><b>Dilutional hyponatremia</b></td></tr></table>
<h4>Nephrotic syndrome</h4>
<div class="flow"><span>Podocyte damage</span><span>Leaky glomerulus</span><span><b>Massive proteinuria</b> (foamy urine)</span><span><b>Hypoalbuminemia</b> → ↓ oncotic pressure</span><span><b>Massive edema</b></span><span>↓ blood volume → RAAS → HTN</span></div>
<p><b>Dehydration:</b> ↑ serum osmolality → hypothalamic osmoreceptors → thirst + ↑ ADH → oliguria.</p>
<table><tr><th>Lab</th><th>Normal</th></tr>
<tr><td>BUN</td><td>10–20 mg/dL</td></tr><tr><td>Creatinine</td><td>0.4–1.2 mg/dL — <b>most specific renal indicator</b></td></tr>
<tr><td>Uric acid</td><td>2.5–8 mg/dL</td></tr><tr><td>Albumin</td><td>3.2–5.5</td></tr>
<tr><td>Na / K</td><td>135–145 / 3.5–5.5 mEq/L</td></tr><tr><td>Ca</td><td>4.5–5.5 mEq/L (8.2–10 mg/dL)</td></tr>
<tr><td>Serum osmolality</td><td>270–290 mOsm/kg</td></tr></table>
<p><small>Phosphorus has an inverse relationship with calcium.</small></p>` },

{ t: "Cystoscopy", h: `
<p>Scope through the urethra into the bladder. </p>
<table><tr><th></th><th>Flexible</th><th>Rigid</th></tr>
<tr><td>Anesthesia</td><td>Local</td><td>General/spinal</td></tr><tr><td>Setting</td><td>Bedside/outpatient</td><td>OR</td></tr>
<tr><td>NPO</td><td>Not necessarily</td><td>6–8 hrs</td></tr></table>
<ul><li>Position: <b>lithotomy</b> (30–45 min) → leg cramps</li>
<li>${FB} <b>Expected 24–48 hrs:</b> <b>pink-tinged urine</b>, burning, frequency</li>
<li><b>Red urine / clots → report</b> (bleeding/perforation)</li>
<li>Pelvic discomfort → <b>hot sitz bath</b>; leg cramps → warm moist soaks</li>
<li><b>Force fluids</b> to prevent ascending UTI; report fever</li></ul>` },

{ t: "Excretory Urogram (IVP)", h: `
<p>IV contrast X-ray of kidneys, ureters, bladder (dye reaches kidneys in ~5 min).</p>
<p><b>Hazards:</b> anaphylaxis (iodine) • nephrotoxicity → AKI • <b>metformin + contrast → lactic acidosis</b>.</p>
<ul><li><b>Before:</b> iodine/seafood allergy; BUN/creatinine; <b>hold metformin 48 hrs before and after</b>; laxative night before; NPO 8 hrs</li>
<li>${FB} <b>During — warn of:</b> <b>metallic/salty taste</b>, <b>flushing</b>, warmth. Watch urticaria, hypotension — <b>epinephrine at bedside</b></li>
<li><b>After:</b> <b>fluids 2–3 L/day</b> to flush dye; watch for delayed allergy</li></ul>` },

{ t: "Renal Biopsy", h: `
<p><b>Gold standard for nephrotic syndrome.</b> Kidneys are retroperitoneal (T12–L3) and highly vascular → bleeding risk.</p>
<ul><li><b>Before:</b> consent; PT/PTT/INR, Hgb/Hct (<b>low Hgb/Hct → postpone</b>); NPO 6–8 hrs</li>
<li>${FB} <b>During:</b> <b>prone with a sandbag/pillow under the abdomen</b>; <b>exhale and hold breath</b> 5–10 sec at needle insertion; mild sedation, lidocaine</li>
<li><b>After:</b> <b>supine on a sandbag/back roll 6–8 hrs</b> (pressure on site); bed rest 24 hrs; watch bleeding (hypotension, tachycardia)</li>
<li><b>Discharge:</b> avoid strenuous activity, heavy lifting, contact sports 1–2 weeks</li></ul>` },

{ t: "Hemodialysis", h: `
<table><tr><th></th><th>AKI</th><th>CKD / ESRD</th></tr>
<tr><td>Damage</td><td>Tubules (glomerulus intact)</td><td>Tubules <b>and</b> glomerulus</td></tr>
<tr><td>Reversible?</td><td><b>Potentially reversible</b></td><td><b>Irreversible</b>; ESRD GFR &lt; 15 mL/min</td></tr></table>
<h4>Vascular access</h4>
<ul><li><b>AV fistula — gold standard</b>: artery-to-vein anastomosis; least infection; matures 6–12 weeks</li>
<li>AV graft: synthetic; more infection; matures 2–3 weeks</li><li>AV shunt; femoral catheter</li></ul>
<h4>Key nursing points</h4>
<ul><li><b>Heparin</b> given before dialysis → bleeding precautions</li>
<li>3–4 hrs, 2–3×/week; blood flow 300–500 mL/min</li>
<li>First session only ~30 min to prevent <b>disequilibrium syndrome</b> (waste removed from blood faster than brain → headache, HTN, confusion, N/V, seizures)</li>
<li><b>Hold antihypertensives</b> before dialysis (hypotension)</li>
<li><b>Fistula arm: no BP, no IV, no venipuncture</b>; no tight clothing/jewelry; no lotion/powder</li>
<li>Patency: <b>auscultate bruit</b> (swooshing), <b>palpate thrill</b> (vibration)</li>
<li><b>Steal syndrome:</b> pale, painful, cool hand with weak pulses</li></ul>` },

{ t: "Peritoneal Dialysis", h: `
<p>Catheter 1–2 inches below umbilicus; peritoneum is the membrane (less bleeding). Complications: <b>peritonitis</b> (rigid abdomen, fever, cloudy effluent) and dyspnea (dialysate pushes diaphragm up).</p>
<table><tr><th>Phase</th><th>Time</th></tr><tr><td>Infusion</td><td>10 min</td></tr><tr><td>Dwell</td><td>4–6 hrs</td></tr><tr><td>Drainage</td><td>30 min</td></tr></table>
<ul><li><b>Warm dialysate to body temperature (37 °C)</b> — prevents cramps, ↑ permeability</li>
<li>Cramping → <b>clamp and wait</b>; don't remove catheter</li>
<li><b>Semi-Fowler's</b> to ease breathing</li>
<li>Bag 12–18 inches above abdomen; drainage bag <b>below</b> abdomen</li>
<li>Drainage: pink at first = normal; red = bleeding; <b>cloudy = peritonitis</b></li>
<li><b>Outflow stops:</b> check tubing for kinks, <b>turn client side to side</b></li>
<li>Dialysate is hypertonic dextrose → watch <b>hyperglycemia</b></li></ul>` }
],

{ t: "Disease Patterns & Epidemiological Shift", h: `
<ul><li><b>Sporadic</b> — few, isolated, irregular cases</li><li><b>Endemic</b> — constantly present (malaria, schistosomiasis); <b>hyperendemic</b> = persistently high</li>
<li><b>Epidemic</b> — sudden increase above baseline (dengue outbreak)</li><li><b>Pandemic</b> — worldwide (COVID-19)</li></ul>
<p>The Philippines is shifting from <b>infectious</b> to <b>degenerative</b> diseases:</p>
<table><tr><th>Disease</th><th>Core pathophysiology</th></tr>
<tr><td>Multiple sclerosis</td><td>Autoimmune CNS demyelination → plaques</td></tr>
<tr><td>Parkinson's</td><td>Loss of dopamine neurons (substantia nigra) → tremor, rigidity, bradykinesia</td></tr>
<tr><td>Alzheimer's</td><td>Amyloid plaques & tau tangles → memory loss</td></tr>
<tr><td>Myasthenia gravis</td><td>Antibodies block ACh receptors → weakness worse with activity (ptosis, diplopia)</td></tr></table>` },

{ t: "Factors Affecting OLOF & Environmental Laws", h: `

{ t: "Paragonimiasis & Schistosomiasis", h: `
<h4>Paragonimiasis (lung fluke)</h4>
<p><i>Paragonimus westermani</i> / <i>P. philippinensis</i>. <b>IP 65–90 days.</b> <b>MOT:</b> eating <b>raw/undercooked freshwater crabs</b> or crayfish.</p>
<p>1st host: freshwater <b>snails</b> (Antemelania) → 2nd host: freshwater <b>crabs</b>. Migrates to the <b>lungs</b> → <b>mimics PTB</b> (cough, rusty sputum, hemoptysis).</p>
<p><b>Dx:</b> sputum exam, CXR. <b>DOC:</b> <b>Praziquantel</b> (old: bithionol).</p>
<h4>Schistosomiasis (blood fluke / snail fever)</h4>
<p><b>MOT:</b> cercariae <b>penetrate skin</b> while wading/swimming/farming in infected fresh water. <b>Swimmer's itch</b> 24–48 hrs after.</p>
<table><tr><th>Species</th><th>Site / sign</th><th>Snail</th></tr>
<tr><td><b>S. japonicum</b> (PH: Leyte, Samar)</td><td>Intestine — bloody stool</td><td><b>Oncomelania quadrasi</b></td></tr>
<tr><td>S. mansoni</td><td>Large intestine — hematochezia</td><td>Biomphalaria</td></tr>
<tr><td><b>S. haematobium</b></td><td><b>Bladder — hematuria</b></td><td>Bulinus</td></tr></table>
<p>Late: ascites, hepatosplenomegaly, portal hypertension. <b>Prevention:</b> sanitary toilets, rubber boots, avoid infected water, molluscicides. <b>DOC: Praziquantel.</b></p>` },

<h4>Vitamin A deficiency (xerophthalmia stages)</h4>

<script>
/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("cra_"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("cra_"+k, JSON.stringify(v)); }catch(e){} }
};
// does this browser actually keep saved progress?
let storageOK = (() => { try{ const k = "cra__t", v = String(Date.now()); localStorage.setItem(k, v); const ok = localStorage.getItem(k) === v; localStorage.removeItem(k); return ok; }catch(e){ return false; } })();
let known = {}, examHist = [], studyDays = [];
let fbOnly = false;
/* ---------- PROFILES (per person, on this device) ---------- */
const COLORS = ["#c2410c","#2f7dd1","#1f9d6b","#8e44ad","#d4880f","#c2185b","#0e8a9e","#3949ab","#5d7a1e","#6d4c41"];
const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
let profiles = store.get("profiles", null);
let activeId = store.get("active", null);
if (!Array.isArray(profiles) || !profiles.length){
  const id = newId();
  profiles = [{ id, name: "Me", color: COLORS[0], created: Date.now() }];
  // carry over progress saved by the earlier single-user version
  store.set("p_" + id, { known: store.get("known", {}), hist: store.get("history", []), days: [] });
  store.set("profiles", profiles); activeId = id;
}
if (!profiles.find(p => p.id === activeId)) activeId = profiles[0].id;
store.set("active", activeId);
const activeProfile = () => profiles.find(p => p.id === activeId);
function loadProfile(){ const d = store.get("p_" + activeId, {}) || {}; known = d.known || {}; examHist = d.hist || []; studyDays = d.days || []; }
function saveProfile(){ store.set("p_" + activeId, { known, hist: examHist, days: studyDays, updated: Date.now() }); }
function profData(id){ if (id === activeId) return { known, hist: examHist, days: studyDays }; const d = store.get("p_" + id, {}) || {}; return { known: d.known || {}, hist: d.hist || [], days: d.days || [] }; }
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
function markStudy(){ const t = dayKey(new Date()); if (!studyDays.includes(t)){ studyDays.push(t); studyDays = studyDays.slice(-400); } }
function switchProfile(id){ saveProfile(); activeId = id; store.set("active", id); loadProfile(); renderWho(); closeModal(); go(current); queueLive(true); }
function addProfile(name){
  name = (name || "").trim().slice(0, 30); if (!name) return;
  const p = { id: newId(), name, color: COLORS[profiles.length % COLORS.length], created: Date.now() };
  profiles.push(p); store.set("profiles", profiles); store.set("p_" + p.id, { known:{}, hist:[], days:[] });
  switchProfile(p.id);
}
function renameProfile(id, name){ name = (name||"").trim().slice(0,30); const p = profiles.find(x=>x.id===id); if (!p || !name) return; p.name = name; store.set("profiles", profiles); renderWho(); queueSync(true); }
function deleteProfile(id){
  if (profiles.length < 2) return;
  profiles = profiles.filter(p => p.id !== id); store.set("profiles", profiles);
  try{ localStorage.removeItem("cra_p_" + id); }catch(e){}
  if (linkId === id){ linkId = null; store.set("link", null); }
  if (activeId === id){ activeId = profiles[0].id; store.set("active", activeId); loadProfile(); }
  renderWho(); closeModal(); go(current);
}
loadProfile();

/* ---------- STATS ---------- */
function streakOf(days){
  const set = new Set(days); let n = 0; const d = new Date();
  if (!set.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (set.has(dayKey(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function stats(d){
  const kn = d.known || {}, hist = d.hist || [];
  const totalCards = DATA.reduce((a,l)=>a+l.cards.length, 0);
  const lec = {};
  DATA.forEach(l => { lec[l.id] = { l, k: l.cards.filter((c,i)=>kn[l.id+"-"+i]).length, t: l.cards.length, c: 0, q: 0, best: null, n: 0 }; });
  let cAll = 0, qAll = 0;
  hist.forEach(h => {
    const bl = h.byLec || (h.lecs && h.lecs.length === 1 ? { [h.lecs[0]]: [h.score, h.total] } : null);
    if (bl) for (const id in bl){ const s = lec[id]; if (!s) continue; s.c += bl[id][0]; s.q += bl[id][1]; s.n++; const p = pct(bl[id][0], bl[id][1]); if (bl[id][1] >= 5) s.best = s.best === null ? p : Math.max(s.best, p); }
    cAll += h.score; qAll += h.total;
  });
  const k = Object.keys(kn).filter(x => { const m = x.match(/^(.*)-(\d+)$/); return m && lec[m[1]]; }).length;
  Object.values(lec).forEach(s => {
    s.cardPct = pct(s.k, s.t); s.acc = s.q ? pct(s.c, s.q) : null;
    s.ready = Math.round(s.acc === null ? s.cardPct * 0.4 : s.cardPct * 0.4 + s.acc * 0.6);
    s.status = (!s.k && !s.q) ? "new" : (s.acc !== null && s.acc >= 85 && s.cardPct >= 80) ? "mastered" : (s.acc !== null && s.acc < 75) ? "weak" : "progress";
  });
  const readiness = Math.round(Object.values(lec).reduce((a,s)=>a + s.ready * s.t, 0) / totalCards);
  return { k, totalCards, exams: hist.length, acc: qAll ? pct(cAll, qAll) : null,
    best: hist.length ? Math.max(...hist.map(h=>pct(h.score,h.total))) : null,
    streak: streakOf(d.days || []), studied: (d.days || []).length, lec, readiness,
    last: hist.length ? hist[hist.length-1].date : null };
}
const STATUS = { new: ["Not started","var(--muted)"], weak: ["Needs work","var(--bad)"], progress: ["In progress","#d4880f"], mastered: ["Mastered","var(--good)"] };
function ring(p, size, color){
  const r = size/2 - 6, c = 2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${p}%"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="8"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size/4.2}" font-weight="700" fill="var(--ink)" font-family="Fraunces,serif">${p}%</text></svg>`;
}
const avatar = (p, s=34) => `<span class="av" style="width:${s}px;height:${s}px;background:${p.color};font-size:${s*0.42}px">${esc((p.name||"?").trim().charAt(0).toUpperCase())}</span>`;
function ago(t){ const m = Math.round((Date.now()-t)/60000); if (m < 1) return "just now"; if (m < 60) return m+" min ago"; const h = Math.round(m/60); if (h < 24) return h+" hr ago"; const d = Math.round(h/24); return d === 1 ? "yesterday" : d+" days ago"; }

/* ---------- WHO'S STUDYING (header pill + modal) ---------- */
function renderWho(){
  const b = document.getElementById("whoBtn"); if (!b) return;
  const p = activeProfile(); b.innerHTML = avatar(p, 26) + `<span class="wn">${esc(p.name)}</span>`;
}
function openProfiles(){
  const rows = profiles.map(p => { const s = stats(profData(p.id)); return `
    <button class="prow ${p.id===activeId?"on":""}" data-p="${p.id}">${avatar(p)}<span class="pn"><b>${esc(p.name)}</b><small>${s.k} cards • ${s.exams} exam${s.exams===1?"":"s"}${linkId===p.id?" • ☁ synced":""}</small></span><span class="pr">${s.readiness}%</span></button>`; }).join("");
  showModal(`<h3 class="serif" style="margin:0 0 4px">Who's studying?</h3>
  <p class="muted" style="margin:0 0 12px;font-size:.88rem">Each person keeps their own cards, scores and streak on this device.</p>
  <div id="plist">${rows}</div>
  <form id="padd" class="row" style="margin-top:12px;flex-wrap:nowrap"><input id="pname" maxlength="30" placeholder="Add a person (name)" autocomplete="off"><button class="btn pri">Add</button></form>
  <div class="row" style="margin-top:14px;justify-content:space-between">
    <div class="row"><button class="btn sm" id="pren">Rename ${esc(activeProfile().name)}</button>${profiles.length>1?`<button class="btn sm" id="pdel" style="color:var(--bad)">Delete</button>`:""}</div>
    <button class="btn sm" onclick="closeModal()">Close</button></div>`);
  document.querySelectorAll(".prow").forEach(b => b.onclick = () => switchProfile(b.dataset.p));
  $("#padd").onsubmit = e => { e.preventDefault(); addProfile($("#pname").value); };
  $("#pren").onclick = () => {
    const p = activeProfile();
    showModal(`<h3 class="serif" style="margin-top:0">Rename</h3><form id="rf"><input id="rn" maxlength="30" value="${esc(p.name)}"><div class="row" style="margin-top:12px"><button type="button" class="btn" onclick="openProfiles()">Back</button><button class="btn pri">Save</button></div></form>`);
    $("#rn").focus(); $("#rf").onsubmit = e => { e.preventDefault(); renameProfile(p.id, $("#rn").value); openProfiles(); };
  };
  if ($("#pdel")) $("#pdel").onclick = () => { const p = activeProfile();
    showModal(`<h3 class="serif" style="margin-top:0">Delete ${esc(p.name)}?</h3><p class="muted">Their cards, scores and streak on this device will be removed.</p><div class="row"><button class="btn" onclick="openProfiles()">Cancel</button><button class="btn acc" onclick="deleteProfile('${p.id}')">Delete</button></div>`); };
}

/* ---------- ONLINE: account backup + class leaderboard ---------- */
let linkId = store.get("link", null);
const cloud = { db: null, user: null, uid: null, owner: false, status: "loading", board: [], backup: undefined, readOnly: false, msg: "" };
(async () => {
  try{
    if (!window.claude || typeof window.claude.use !== "function"){ cloud.status = "off"; return; }
    const [db, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    cloud.db = db; cloud.user = u;
    if (!db || !u){ cloud.status = "off"; refreshProgress(); return; }
    cloud.uid = await u.id();
    cloud.owner = await u.isOwner();
    if ((await u.can("data.write")) === false && !cloud.owner) cloud.readOnly = true;
    const timer = setTimeout(() => { if (cloud.status === "loading"){ cloud.status = "slow"; refreshProgress(); } }, 10000);

let syncChain = Promise.resolve(), syncTimer = null, lastBoard = "", lastBackup = "";

async function pushCloud(){
  if (!cloud.db || !cloud.uid || linkId !== activeId) return;
  const p = activeProfile(), d = profData(activeId), s = stats(d);
  const board = { nick: p.name.slice(0,30), color: p.color, readiness: s.readiness, cards: s.k, totalCards: s.totalCards, exams: s.exams, acc: s.acc === null ? -1 : s.acc, streak: s.streak };
  const backup = { name: p.name, known: d.known, hist: d.hist, days: d.days };
  try{
    const bj = JSON.stringify(backup);
    if (bj !== lastBackup){ await cloud.db.doc("data/users/" + cloud.uid + "/progress").set({ ...backup, updated: Date.now() }); lastBackup = bj; cloud.backup = { ...backup, updated: Date.now() }; }
    const j = JSON.stringify(board);
    if (j !== lastBoard){ await cloud.db.doc("board/" + cloud.uid).set({ ...board, updated: Date.now() }); lastBoard = j; }
    cloud.msg = "";
  }catch(e){
    if (e && e.code === "invalid_argument"){ cloud.readOnly = true; cloud.msg = "readonly"; }
    else if (e && e.code === "quota_exceeded") cloud.msg = "full";

}
function mergeData(a, b){
  const hist = [...(a.hist||[])]; (b.hist||[]).forEach(h => { if (!hist.some(x => x.date === h.date)) hist.push(h); });

}

}
