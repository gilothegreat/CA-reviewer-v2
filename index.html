/* ---------- PROGRESS CODES (works for anyone, no sign-in) ---------- */
function b64e(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64d(str){ str = str.replace(/-/g,"+").replace(/_/g,"/"); while (str.length % 4) str += "="; return decodeURIComponent(escape(atob(str))); }
function hash(str){ let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36); }
function bits(l, kn){ const n = Math.ceil(l.cards.length/8), a = new Uint8Array(n); l.cards.forEach((c,i)=>{ if (kn[l.id+"-"+i]) a[i>>3] |= 1<<(i&7); }); return a.some(x=>x) ? btoa(String.fromCharCode(...a)) : ""; }
function unbits(l, s, out){ if (!s) return; const a = atob(s); l.cards.forEach((c,i)=>{ if ((a.charCodeAt(i>>3)||0) & (1<<(i&7))) out[l.id+"-"+i] = 1; }); }
function makeCode(id){
  const p = profiles.find(x=>x.id===id), d = profData(id), k = {};
  DATA.forEach(l => { const b = bits(l, d.known); if (b) k[l.id] = b; });
  const h = d.hist.slice(-40).map(x => [Math.round(x.date/1000), x.score, x.total, x.mode === "exam" ? 1 : 0,
    x.byLec ? Object.entries(x.byLec).map(([id,v]) => id+":"+v[0]+"/"+v[1]).join(";") : (x.lecs||[]).join(";")]);
  const body = b64e(JSON.stringify({ i: p.src || p.id, n: p.name, c: p.color, t: Math.round(Date.now()/1000), k, h, d: d.days.slice(-60) }));
  return "CAR2-" + body + "." + hash(body);
}
function readCode(raw){
  let txt = String(raw || "").replace(/[​-‍﻿ ]/g, " ");
  let body = null, m;
  if ((m = txt.replace(/\s+/g, "").match(/CAR2-([A-Za-z0-9_-]+)\.([a-z0-9]+)/))){
    if (hash(m[1]) !== m[2]) throw new Error("The code is incomplete or was changed when it was sent. Ask for it again and copy the whole thing (it ends with a dot and a few letters).");
    body = m[1];
  } else if ((m = txt.match(/CAR1:([A-Za-z0-9+/= \n\r]+)/))){            // older codes
    body = m[1].replace(/[\r\n]/g, "").replace(/ /g, "+").replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  } else if (/CAR2-/.test(txt.replace(/\s+/g, ""))){
    throw new Error("The end of the code is missing. Copy the whole code, including the last part after the dot.");
  } else throw new Error("That doesn't look like a progress code. It should start with CAR2-");
  let o; try{ o = JSON.parse(b64d(body)); }catch(e){ throw new Error("The code couldn't be read — it may be cut off. Ask for it again."); }
  if (!o || typeof o.n !== "string" || typeof o.i !== "string") throw new Error("This code is incomplete — ask for it again.");
  const sec = v => v > 1e11 ? +v : +v * 1000;
  const known = {}; DATA.forEach(l => { try{ unbits(l, o.k && o.k[l.id], known); }catch(e){} });
  const hist = (Array.isArray(o.h) ? o.h : []).filter(x => Array.isArray(x) && x[2] > 0).map(x => {
    let byLec, lecs = [];
    if (typeof x[4] === "string"){ byLec = {}; x[4].split(";").forEach(part => { const mm = part.match(/^([\w-]+):(\d+)\/(\d+)$/); if (mm && LEC(mm[1])){ byLec[mm[1]] = [+mm[2], +mm[3]]; lecs.push(mm[1]); } else if (LEC(part)) lecs.push(part); }); if (!Object.keys(byLec).length) byLec = undefined; }
    else { lecs = Array.isArray(x[4]) ? x[4].filter(id => LEC(id)) : []; byLec = x[5] && typeof x[5] === "object" ? x[5] : undefined; }
    return { date: sec(x[0]), score: +x[1], total: +x[2], mode: x[3] ? "exam" : "practice", lecs, byLec };
  });
  const days = (Array.isArray(o.d) ? o.d : []).filter(s => /^\d{4}-\d\d-\d\d$/.test(s));
  return { src: o.i.slice(0,40), name: o.n.trim().slice(0,30) || "Classmate", color: /^#[0-9a-f]{6}$/i.test(o.c) ? o.c : COLORS[profiles.length % COLORS.length], t: sec(o.t || Date.now()/1000), known, hist, days };
}
function importCode(code){
  const r = readCode(code);
  let p = profiles.find(x => x.src === r.src || x.id === r.src);
  if (p && !p.imported) throw new Error("This is " + p.name + "'s own code from this device — it's already here. Send it to the person tracking the class, and paste codes you receive from others.");
  if (!p){ const used = profiles.map(x=>x.color); p = { id: newId(), src: r.src, name: r.name, color: used.includes(r.color) ? (COLORS.find(c=>!used.includes(c)) || r.color) : r.color, created: Date.now() }; profiles.push(p); }
  p.name = r.name; p.imported = r.t; p.src = r.src;
  store.set("profiles", profiles);
  store.set("p_" + p.id, { known: r.known, hist: r.hist, days: r.days });
  return p;
}

  <p class="muted" style="font-size:.78rem;margin:8px 0 0">If Copy doesn't work: press and hold inside the box → Select All → Copy.</p>`);
  const ta = $("#codeBox");

const AI_RULES = `You are a friendly, precise nursing board-exam tutor helping a Filipino nursing student review flashcards from their Course Audit lecture notes.
Rules:
- Base your answer on the card and the lecture notes provided. Use the lecture's own values, mnemonics and drug names.
- If the lecture's value differs from common textbook references, give the lecture's value first and briefly note the usual reference value.
- Be concise: about 80–150 words unless the student asks for more. Use short paragraphs or "- " bullets and **bold** for key terms. No headings, no tables.
- Explain the "why" (pathophysiology / rationale) so it sticks, and connect it to nursing actions when relevant.
- If asked for a quiz question, give one multiple-choice question with 4 options (A–D), and put the answer and rationale after a line that says "Answer:".
- You may reply in Taglish if the student writes in Filipino.`;

const AI_PRESETS = [
  ["explain", "💡 Explain", "Explain this flashcard so I understand it, including the why behind it."],
  ["simple", "🧒 Simpler", "Explain this flashcard in very simple words, like I'm a first-year student, with an everyday analogy."],
  ["mnemonic", "🧠 Mnemonic", "Give me a memorable mnemonic or memory trick for this flashcard (use the lecture's mnemonic if there is one, and add another way to remember it)."],
  ["clinical", "🏥 Clinical case", "Give a short realistic clinical scenario where this fact matters and what the nurse should do."],
  ["quiz", "❓ Quiz me", "Write one board-style multiple-choice question that tests this flashcard."]
];

function plainSection(card){
  // the reviewer section from this lecture that best matches the card, as plain text
  const words = (card.f + " " + card.b).toLowerCase().match(/[a-z0-9]{4,}/g) || [];
  let best = null, bestScore = -1;
  card.l.sections.forEach(s => {
    const t = (s.t + " " + s.h.replace(/<[^>]+>/g, " ")).toLowerCase();
    let sc = 0; words.forEach(w => { if (t.includes(w)) sc++; });
    if (sc > bestScore){ bestScore = sc; best = s; }
  });
  if (!best) return "";
  const txt = best.h.replace(/<\/(tr|li|p|h4|div)>/g, "\n").replace(/<td[^>]*>/g, " | ").replace(/<[^>]+>/g, "").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").replace(/\n\s*\n+/g, "\n").trim();
  return "Section: " + best.t + "\n" + txt.slice(0, 3500);
}
function cardContext(card){
  return `${AI_RULES}

Lecture: ${card.l.title}
Flashcard front: ${card.f}
Flashcard back: ${card.b}

Relevant lecture notes:
${plainSection(card)}`;
}
function mdLite(text){
  // escape, then allow **bold** and "- " bullets only
  const lines = esc(text).split("\n");
  let out = "", inList = false;
  lines.forEach(line => {
    const m = line.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
    const fmt = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    if (m){ if (!inList){ out += "<ul>"; inList = true; } out += "<li>" + fmt(m[1]) + "</li>"; }
    else { if (inList){ out += "</ul>"; inList = false; } if (line.trim()) out += "<p>" + fmt(line) + "</p>"; }
  });
  return out + (inList ? "</ul>" : "");
}
function aiErrorText(e){
  const c = e && e.code;
  if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){ ai.state = "off"; return "The AI tutor isn't available for your account here."; }
  if (c === "rate_limited") return e.reason === "usage_limit" ? "You've reached your Claude usage limit for now. Try again later." : "Too many questions at once — wait a moment, then try again.";
  if (c === "session_expired") return "Please sign in to Claude again, then try again.";
  if (c === "refused") return "The tutor couldn't answer that. Try asking it a different way.";
  if (c === "cancelled") return "";
  return "Something went wrong reaching the tutor. Tap a button to try again.";
}

async function askAi(prompt, label, preset){
  if (!ai.fn || ai.busy) return;
  const card = fc.deck[fc.i]; if (!card) return;
  if (!fc.flipped){ fc.flipped = true; const c = $("#fcCard"); if (c) c.classList.add("flip"); }
  const cardId = card.id;
  // a preset on a fresh card is cached (same card + same button replays free); follow-ups always ask
  const fresh = !ai.turns.length;
  ai.turns.push({ role: "user", content: prompt, label });
  ai.busy = true; ai.note = ""; ai.ctl = new AbortController();
  renderAiPanel();
  const recent = ai.turns.slice(-9).map(t => ({ role: t.role, content: t.content }));
  const input = [{ role: "user", content: cardContext(card) + "\n\nThe student's messages follow." }, ...recent];
  try{
    const { text, truncated } = await ai.fn(input, {
      modelTier: "quick", signal: ai.ctl.signal, cache: fresh && preset ? true : false,
      onText: ({ text }) => { const live = document.getElementById("aiLive"); if (live && ai.card === cardId) live.innerHTML = mdLite(text); }
    });
    if (ai.card !== cardId) return;
    ai.turns.push({ role: "assistant", content: text });
    if (truncated) ai.note = "The answer was cut short — ask for a shorter version.";
  }catch(e){
    if (ai.card !== cardId) return;
    if (e && e.text && e.code !== "refused") ai.turns.push({ role: "assistant", content: e.text });
    else ai.turns.pop();
    ai.note = aiErrorText(e);
  }
  ai.busy = false; ai.ctl = null;
  if (current === "flashcards") renderAiPanel();
  const log = document.getElementById("aiLog"); if (log) log.lastElementChild?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function isTagalog(line){
  const w = line.toLowerCase().replace(/[^a-z' ]/g, " ").split(/\s+/).filter(Boolean);
  if (!w.length) return false;
  return w.filter(x => TL_WORDS.has(x) || /^(nag|mag|pag|naka|maka|ipa|napa|pina|ika|ipag|nakaka|makaka)[a-z]{3,}/.test(x) || /(han|hin|an|in)$/.test(x) && x.length > 6 && !/tion$|ian$/.test(x)).length / w.length >= 0.3;
}
const isPH = v => /(fil|tl)[-_]?/i.test(v.lang) || /PH$/i.test(v.lang) || /philippin|filipin|blessica|rosa|angelo|james.*phil/i.test(v.name);
const isFil = v => /^(fil|tl)/i.test(v.lang) || /filipino|blessica|angelo/i.test(v.name);
function niceBrowserVoices(){
  try{
    const vs = speechSynthesis.getVoices().filter(v => /^(en|fil|tl)/i.test(v.lang));
    const score = v => (isPH(v) ? 10 : 0) + (/natural|neural|online/i.test(v.name) ? 4 : 0) + (/google/i.test(v.name) ? 3 : 0) + (/samantha|aria|jenny|libby|sonia|ava|allison|zira/i.test(v.name) ? 2 : 0) + (/en-(US|GB|AU)/i.test(v.lang) ? 1 : 0);
    return vs.sort((a,b) => score(b) - score(a)).slice(0, 8);
  }catch(e){ return []; }
}
function browserVoiceFor(line){
  const vs = niceBrowserVoices(); if (!vs.length) return null;
  const chosen = vs[tutor.voiceIx % vs.length];
  if (isTagalog(line)){ const fil = vs.find(isFil); if (fil) return fil; }
  else if (isFil(chosen)){ const enph = vs.find(v => isPH(v) && !isFil(v)); if (enph) return enph; }
  return chosen;
}
const hasPHVoice = () => { try{ return speechSynthesis.getVoices().some(isPH); }catch(e){ return false; } };
try{ if (typeof speechSynthesis !== "undefined") speechSynthesis.onvoiceschanged = () => { document.querySelectorAll('[data-t="change"]').forEach(b => b.textContent = "🎙 " + voiceLabel()); }; }catch(e){}
function voiceLabel(){
  if (tutor.tts) return "🇵🇭 " + TTS_VOICES[tutor.voiceIx % TTS_VOICES.length][1];
  const vs = niceBrowserVoices(); const v = vs[tutor.voiceIx % Math.max(vs.length,1)];
  return v ? (isPH(v) ? "🇵🇭 " : "") + v.name.replace(/Microsoft |Google |\(.*\)| Online| Natural|- .*$/g, "").trim().slice(0,14) : "Default";
}
function sentences(text){
  // group sentences into 1–2 sentence lines so the voice breathes between thoughts
  const parts = cleanSpeech(text).match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g) || [text];
  const lines = []; let cur = "";
  parts.forEach(p => { p = p.trim(); if (!p) return; if ((cur + " " + p).length > 160 && cur){ lines.push(cur); cur = p; } else cur = cur ? cur + " " + p : p; });
  if (cur) lines.push(cur);
  return lines;
}

  }catch(e){ tutor.tts = null; }
})();
const browserVoice = () => !tutor.tts && typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";
function setTalking(on){ document.querySelectorAll(".tav").forEach(a => a.classList.toggle("talking", !!on)); }
function cleanSpeech(t){ return String(t).replace(/\*\*/g, "").replace(/[#>`_]/g, "").replace(/\s+/g, " ").trim().slice(0, 1900); }
function speakNow(text, queue){
  if (!tutor.voiceOn || tutor.blocked || !text) return;
  if (tutor.tts){
    const voice = TTS_VOICES[tutor.voiceIx % TTS_VOICES.length][0];
    const fil = (tutor.langs || []).find(l => /^(fil|tl)$/i.test(l)) || "fil";
    const lines = sentences(text).map(t => ({ text: t, voice, rate: isBard() ? 1.1 : 1.06, language: isTagalog(t) ? fil : "en-PH" }));
    if (!lines.length) return;
    const p = queue ? tutor.tts.add(lines) : tutor.tts.speak(lines);
    p.catch(e => { if (e && e.code === "not_granted"){ tutor.blocked = true; tutor.tts = null; } });
    return;
  }
  if (browserVoice()){
    try{
      if (!queue) speechSynthesis.cancel();
      sentences(text).forEach((t, i) => {
        const u = new SpeechSynthesisUtterance(t), v = browserVoiceFor(t);
        if (v) u.voice = v; u.lang = (v && v.lang) || (isTagalog(t) ? "fil-PH" : "en-PH");
        u.rate = (isBard() ? 1.08 : 1.03) + (i % 2 ? -0.03 : 0.03); u.pitch = 1.15 + (i % 3 === 2 ? 0.07 : 0);   // livelier, sing-song Pinoy cadence
        u.onstart = () => setTalking(true); u.onend = u.onerror = () => setTimeout(() => setTalking(speechSynthesis.speaking), 60);
        speechSynthesis.speak(u);
      });
    }catch(e){}
  }
}
function hush(){
  if (tutor.ctl){ tutor.ctl.abort(); tutor.ctl = null; }
  try{ if (tutor.tts && tutor.tts.active()) tutor.tts.stop().catch(()=>{}); }catch(e){}

}

    if (!n || (!/\d/.test(n) && (n.length < 4 || STOP.has(n))) || front.has(n) || /^[+&=/–—-]+$/.test(core)) return null;
    return { idx, core, n, score: (/\d/.test(n) ? 6 : 0) + Math.min(core.length, 12) + (/^[A-Z]/.test(core) ? 1 : 0) };
  }).filter(Boolean);
}
function makeCloze(it, pool){
  const parts = it.b.split(/(\s+)/), cands = clozeCandidates(it);
  if (!cands.length) return null;
  const words = parts.filter(p => !/^\s*$/.test(p)).length, want = words >= 7 ? 2 : 1;
  const chosen = [];
  cands.slice().sort((a,b) => b.score - a.score).forEach(c => { if (chosen.length < want && !chosen.some(x => Math.abs(x.idx - c.idx) <= 2 || x.n === c.n)) chosen.push(c); });
  chosen.sort((a,b) => a.idx - b.idx);
  // distractors: same kind (number vs word) from other cards of the same lecture
  const others = [];
  pool.filter(o => o.l === it.l && o.id !== it.id).forEach(o => clozeCandidates(o).forEach(c => others.push(c)));
  const bank = chosen.map(c => c.core), seen = new Set(chosen.map(c => c.n));
  chosen.forEach(c => {
    const isNum = /\d/.test(c.n);
    shuffle(others.filter(o => (/\d/.test(o.n)) === isNum && !seen.has(o.n) && (isNum || Math.abs(o.core.length - c.core.length) <= 5))).slice(0, chosen.length === 1 ? 3 : 2)
      .forEach(o => { seen.add(o.n); bank.push(o.core); });
  });
  return { parts, blanks: chosen.map(c => ({ idx: c.idx, word: c.core, n: c.n, pre: (parts[c.idx].match(PUNCT)||[])[1] || "", post: (parts[c.idx].match(PUNCT)||[])[3] || "" })), bank: shuffle(bank) };
}
function blankOk(user, b){
  const u = normTok(String(user || "").trim()); if (!u) return false;
  if (u === b.n) return true;
  if (/\d/.test(b.n)) return u.replace(/[^0-9.]/g, "") === b.n.replace(/[^0-9.]/g, "") && /\d/.test(u);
  return b.n.length >= 6 && u.length >= 5 && (b.n.startsWith(u.slice(0,6)) || u.startsWith(b.n.slice(0,6)));
}
function clozeSentence(cz, fills, checked, editable, hard){
  let bi = 0;
  return cz.parts.map((p, i) => {
    const b = cz.blanks.find(x => x.idx === i);
    if (!b) return esc(p);
    const k = cz.blanks.indexOf(b), f = fills[k] || "";
    if (checked){
      const ok = blankOk(f, b);
      return esc(b.pre) + `<span class="slot ${ok ? "ok" : "ko"}">${ok ? esc(f || b.word) : `${f ? `<s>${esc(f)}</s> ` : ""}${esc(b.word)}`}</span>` + esc(b.post);
    }
    if (hard) return esc(b.pre) + `<input class="slotin" data-b="${k}" value="${esc(f)}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(4, b.word.length + 1)}ch" aria-label="blank ${k+1}">` + esc(b.post);
    return esc(b.pre) + `<button class="slot ${f ? "filled" : ""} ${wr.sel === k ? "sel" : ""}" data-b="${k}">${f ? esc(f) : "&nbsp;".repeat(Math.max(6, Math.min(14, b.word.length)))}</button>` + esc(b.post);
  }).join("");
}

    if (e.code==="Space"){ e.preventDefault(); $("#fcCard").click(); }
    else if (e.key==="ArrowRight") answerCard(true);
    else if (e.key==="ArrowLeft") answerCard(false);
  }
  if (current==="exam" && ex.qs && !ex.done && !e.target.matches("input")){
    const k = {"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3}[e.key.toLowerCase()];
    if (k!==undefined) pick(k);
    else if (e.key==="ArrowRight"||e.key==="Enter") { const n=$("#exNext"); if(n && !n.disabled) n.click(); }
    else if (e.key==="ArrowLeft") { const p=$("#exPrev"); if(p && !p.disabled) p.click(); }
  }
});

/* ---------- EXAM ---------- */
let ex = {};
let setup = { lecs:["L1"], n:20, mode:"practice", timed:true };
let timerId = null;
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId=null; } }
function Exam(o){
  if (o.lecs) setup.lecs = o.lecs.slice();
  if (o.n) setup.n = o.n;
  if (o.mode) setup.mode = o.mode;
  ex = {};
  const pool = () => setup.lecs.reduce((a,id)=>a+LEC(id).quiz.length,0);
  app.innerHTML = `
  <h2 class="serif" style="margin:6px 0 12px">Practice Exam</h2>
  <div class="card">
    <div class="sect-title" style="margin-top:0">Lectures</div>
    <div class="row" style="margin-bottom:8px"><button class="btn sm" id="exAll">Select all</button><button class="btn sm" id="exNone">Clear</button></div><div class="row chips wrap" id="exL">${DATA.map(l=>`<button class="chip ${setup.lecs.includes(l.id)?"on":""}" data-l="${l.id}"><span class="dot" style="background:${l.color}"></span><b style="opacity:.6">${l.id.slice(1)}</b> ${l.short}</button>`).join("")}</div>
    <div class="sect-title">Number of questions</div>
    <div class="row" id="exN">${[10,20,30,50,100,0].map(n=>`<button class="chip ${setup.n===n?"on":""}" data-n="${n}">${n||"All"}</button>`).join("")}</div>
    <div class="sect-title">Mode</div>
    <div class="row" id="exM">
      <button class="chip ${setup.mode==="practice"?"on":""}" data-m="practice">Practice — instant feedback</button>
      <button class="chip ${setup.mode==="exam"?"on":""}" data-m="exam">Exam — graded at the end</button>
    </div>
    <label class="toggle" style="margin-top:14px"><input type="checkbox" id="exTut" ${tutor.on?"checked":""}> 🧑‍⚕️ Talking tutor explains wrong answers (voice + AI)</label>
    <label class="toggle" style="margin-top:10px" id="exTwrap"><input type="checkbox" id="exT" ${setup.timed?"checked":""}> Timer (1 minute per question)</label>
    <p class="muted" id="exInfo" style="font-size:.88rem;margin:14px 0"></p>
    <button class="btn acc" id="exGo" style="width:100%;padding:14px">Start</button>
  </div>
  ${examHist.length?`<div class="sect-title">Recent results</div><div class="card hist">${examHist.slice(-5).reverse().map(h=>`<div><span>${lecsLabel(h.lecs)} • ${h.mode||""}</span><b>${pct(h.score,h.total)}%</b></div>`).join("")}</div>`:""}`;
  const upd = () => { const p = pool(); const n = setup.n ? Math.min(setup.n,p) : p;
    $("#exInfo").textContent = setup.lecs.length ? `${n} questions from a pool of ${p}. Passing score: 75%.` : "Select at least one lecture.";
    $("#exGo").disabled = !setup.lecs.length; $("#exTwrap").classList.toggle("hide", setup.mode!=="exam"); };
  $("#exL").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; const id=b.dataset.l;
    setup.lecs = setup.lecs.includes(id) ? setup.lecs.filter(x=>x!==id) : DATA.map(l=>l.id).filter(x=>x===id||setup.lecs.includes(x)); b.classList.toggle("on"); upd(); };
  $("#exN").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; setup.n=+b.dataset.n; document.querySelectorAll("#exN .chip").forEach(c=>c.classList.toggle("on",c===b)); upd(); };
  $("#exM").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; setup.mode=b.dataset.m; document.querySelectorAll("#exM .chip").forEach(c=>c.classList.toggle("on",c===b)); upd(); };
  $("#exAll").onclick = () => { setup.lecs = DATA.map(l=>l.id); Exam({}); };
  $("#exNone").onclick = () => { setup.lecs = []; Exam({}); };
  $("#exTut").onchange = e => { tutor.on = e.target.checked; store.set("tutor", tutor.on); };
  $("#exT").onchange = e => setup.timed = e.target.checked;
  $("#exGo").onclick = () => startExam();
  upd();
}
function startExam(qsOverride){
  let all = [];
  setup.lecs.forEach(id => LEC(id).quiz.forEach((q,i) => all.push({...q, l:LEC(id), id:id+"-"+i})));
  let qs = qsOverride || shuffle(all).slice(0, setup.n || all.length);
  qs = qs.map(q => { const order = shuffle([0,1,2,3].slice(0,q.o.length)); return {...q, opts: order.map(k=>q.o[k]), ans: order.indexOf(0)}; });
  ex = { qs, i:0, picks: Array(qs.length).fill(null), mode: setup.mode, done:false, timeLeft: qs.length*60, timed: setup.mode==="exam" && setup.timed };
  if (ex.timed){ timerId = setInterval(() => { ex.timeLeft--; const t=$("#exTimer"); if(t) t.textContent=fmt(ex.timeLeft); if (ex.timeLeft<=0) finishExam(); }, 1000); }
  renderQ();
}
const fmt = s => `${Math.floor(Math.max(s,0)/60)}:${String(Math.max(s,0)%60).padStart(2,"0")}`;
function renderQ(){
  const q = ex.qs[ex.i], p = ex.picks[ex.i], practice = ex.mode==="practice", revealed = practice && p!==null;
  const answered = ex.picks.filter(x=>x!==null).length;
  app.innerHTML = `
  <div class="row" style="justify-content:space-between">
    <span class="q-num">Question ${ex.i+1} / ${ex.qs.length}</span>
    <div class="row">${ex.timed?`<span class="timer" id="exTimer">${fmt(ex.timeLeft)}</span>`:""}<button class="btn sm" id="exQuit">Quit</button></div>
  </div>
  <div class="progress" style="margin:8px 0 14px"><b style="width:${pct(practice?ex.i+(revealed?1:0):answered, ex.qs.length)}%"></b></div>
  <div class="card">
    <small style="color:${q.l.color};font-weight:700">${q.l.short}</small>
    <div class="q-text">${esc(q.q)}</div>
    ${q.opts.map((o,k)=>{ let cls="opt"; if(revealed){ if(k===q.ans) cls+=" right"; else if(k===p) cls+=" wrong"; } else if(k===p) cls+=" sel";
      return `<button class="${cls}" data-k="${k}" ${revealed?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`; }).join("")}
    ${revealed?`<div class="rat">${p===q.ans?'<b class="g">Correct!</b>':'<b class="r">Incorrect.</b> Answer: <b>'+esc(q.opts[q.ans])+'</b>'}<br>${esc(q.r)}</div>${p!==q.ans && tutor.on?'<div id="tutorBox"></div>':""}`:""}
  </div>
  <div class="row" style="margin-top:14px;justify-content:space-between">
    <button class="btn" id="exPrev" ${ex.i===0||practice?"disabled":""} ${practice?'style="visibility:hidden"':""}>← Prev</button>
    ${ex.i===ex.qs.length-1
      ? `<button class="btn acc" id="exNext" ${practice&&!revealed?"disabled":""}>${practice?"See results":"Submit exam"}</button>`
      : `<button class="btn pri" id="exNext" ${practice&&!revealed?"disabled":""}>Next →</button>`}
  </div>
  ${!practice?`<div class="pal">${ex.qs.map((_,k)=>`<button class="${ex.picks[k]!==null?"ans":""} ${k===ex.i?"cur":""}" data-j="${k}">${k+1}</button>`).join("")}</div>
  <p class="muted" style="font-size:.85rem">${answered} of ${ex.qs.length} answered</p>`:""}
  <div class="kbd">Keys: 1–4 or A–D to answer • Enter/→ next</div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));
  if (revealed && p!==q.ans && tutor.on && ex.tut && ex.tut[ex.i]) paintTutor($("#tutorBox"), ex.tut[ex.i]);
  $("#exNext").onclick = () => { hush(); if (ex.i===ex.qs.length-1) confirmFinish(); else { ex.i++; renderQ(); window.scrollTo(0,0);} };
  $("#exPrev").onclick = () => { hush(); if (ex.i>0){ ex.i--; renderQ(); } };
  $("#exQuit").onclick = () => showModal(`<h3 class="serif" style="margin-top:0">Quit this exam?</h3><p class="muted">Your answers won't be saved.</p><div class="row"><button class="btn" onclick="closeModal()">Keep going</button><button class="btn acc" onclick="closeModal();go('exam')">Quit</button></div>`);
  app.querySelectorAll(".pal button").forEach(b => b.onclick = () => { ex.i=+b.dataset.j; renderQ(); });
}
function pick(k){
  if (ex.done || !ex.qs) return;
  const q = ex.qs[ex.i]; if (k>=q.opts.length) return;
  if (ex.mode==="practice" && ex.picks[ex.i]!==null) return;
  ex.picks[ex.i] = k; renderQ();
  if (ex.mode==="practice"){
    if (k !== q.ans && tutor.on){ const i = ex.i; ex.tut = ex.tut || {}; ex.tut[i] = {};
      runTutor(q, k, ex.tut[i], () => (current==="exam" && ex.qs && !ex.done && ex.i===i) ? document.getElementById("tutorBox") : null);
      setTimeout(() => { const b = document.getElementById("tutorBox"); if (b) b.scrollIntoView({ block:"nearest", behavior:"smooth" }); }, 80); }
    else hush();
  }
}
function confirmFinish(){
  const un = ex.picks.filter(x=>x===null).length;
  if (ex.mode==="exam" && un){ showModal(`<h3 class="serif" style="margin-top:0">Submit with ${un} unanswered?</h3><p class="muted">Unanswered items are marked wrong.</p><div class="row"><button class="btn" onclick="closeModal()">Go back</button><button class="btn acc" onclick="closeModal();finishExam()">Submit</button></div>`); return; }
  finishExam();
}
let revFilter = "wrong";
function finishExam(){
  hush();
  stopTimer(); if (ex.done) return; ex.done = true;
  const score = ex.qs.filter((q,k)=>ex.picks[k]===q.ans).length;
  const byLec = {}; ex.qs.forEach((q,k)=>{ const b = byLec[q.l.id] = byLec[q.l.id]||[0,0]; b[1]++; if(ex.picks[k]===q.ans) b[0]++; });
  examHist.push({ date: Date.now(), lecs: setup.lecs.slice(), score, total: ex.qs.length, mode: ex.mode, byLec });
  examHist = examHist.slice(-100); markStudy(); saveProfile(); queueSync(true);
  renderResults();
}
function renderResults(){
  const score = ex.qs.filter((q,k)=>ex.picks[k]===q.ans).length, p = pct(score, ex.qs.length);
  const by = {}; ex.qs.forEach((q,k)=>{ const b = by[q.l.id] = by[q.l.id]||{l:q.l,c:0,t:0}; b.t++; if(ex.picks[k]===q.ans) b.c++; });
  const wrong = ex.qs.filter((q,k)=>ex.picks[k]!==q.ans);
  const list = ex.qs.map((q,k)=>({q,k})).filter(({q,k}) => revFilter==="all" || ex.picks[k]!==q.ans);
  app.innerHTML = `
  <div class="card" style="text-align:center">
    <small class="muted">${ex.mode==="exam"?"Exam":"Practice"} result</small>
    <div class="score serif" style="color:${p>=75?"var(--good)":"var(--bad)"}">${p}%</div>
    <div>${score} / ${ex.qs.length} correct <span class="pill ${p>=75?"pass":"fail"}">${p>=75?"PASSED":"BELOW 75%"}</span></div>
    <div style="margin-top:16px;text-align:left">${Object.values(by).map(b=>`
      <div class="stat" style="margin-top:8px"><span>${b.l.short}</span><span>${b.c}/${b.t}</span></div>
      <div class="meter" style="margin-top:4px"><b style="width:${pct(b.c,b.t)}%;background:${b.l.color}"></b></div>`).join("")}</div>
    <div class="row" style="justify-content:center;margin-top:16px">
      ${wrong.length?`<button class="btn acc" id="reWrong">Retake ${wrong.length} wrong</button>`:""}
      <button class="btn" id="reNew">New exam</button>
      <button class="btn" onclick="go('home')">Home</button>
    </div>
  </div>
  <div class="row" style="justify-content:space-between;margin-top:20px">
    <h3 class="serif" style="margin:0">Review answers</h3>
    <div class="row"><button class="chip ${revFilter==="wrong"?"on":""}" data-f="wrong">Wrong only</button><button class="chip ${revFilter==="all"?"on":""}" data-f="all">All</button></div>
  </div>
  <div class="card" style="margin-top:10px;padding-top:4px">
  ${list.length ? list.map(({q,k})=>{ const ok = ex.picks[k]===q.ans; return `
    <div class="rev"><div><b style="color:${ok?"var(--good)":"var(--bad)"}">${ok?"✓":"✗"} ${k+1}.</b> ${esc(q.q)}</div>
    <div class="a">${!ok?`<span style="color:var(--bad)">Your answer: ${ex.picks[k]===null?"(none)":esc(q.opts[ex.picks[k]])}</span><br>`:""}
    <span style="color:var(--good)">Correct: <b>${esc(q.opts[q.ans])}</b></span></div>
    <div class="a muted">${esc(q.r)}</div>${!ok?`<button class="btn sm" style="margin-top:8px" data-tut="${k}">🧑‍⚕️ Explain my mistake</button>`:""}</div>`; }).join("") : `<p class="muted" style="text-align:center;padding:16px 0">Perfect — no wrong answers!</p>`}
  </div>`;
  if ($("#reWrong")) $("#reWrong").onclick = () => startExam(shuffle(wrong.map(q=>({q:q.q,o:q.o,r:q.r,l:q.l,id:q.id}))));
  $("#reNew").onclick = () => go("exam");
  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { revFilter=b.dataset.f; renderResults(); });
  app.querySelectorAll("[data-tut]").forEach(b => b.onclick = () => { const k = +b.dataset.tut; openTutorModal(ex.qs[k], ex.picks[k]); });
  window.scrollTo(0,0);
}

/* ---------- start ---------- */
renderWho();
go((location.hash||"#home").slice(1));
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
